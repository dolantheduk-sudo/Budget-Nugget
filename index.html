<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100D0A">
<title>Budget Nugget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#100D0A; --surface:#1A1611; --surface2:#241F17; --line:#3A3021;
    --gold:#F0BC4E; --gold-hi:#FFF1C2; --gold-lo:#A9741F; --gold-deep:#6E4A11;
    --cream:#F6EFE1; --muted:#A2937D; --red:#EC7259; --green:#86C99A;
    --display:'Fraunces',Georgia,serif;
    --sans:'Space Grotesk',system-ui,sans-serif;
    --glow:0 0 30px -8px rgba(240,188,78,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--void)}
  body{color:var(--cream);font-family:var(--sans);font-size:16px;line-height:1.45;
    padding-bottom:calc(80px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:16px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .hide{display:none !important}
  ::selection{background:var(--gold);color:var(--void)}
  svg{flex:none}

  /* ================= header ================= */
  header{position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,#1A150E 0%,var(--void) 74%);
    padding:calc(10px + env(safe-area-inset-top)) 20px 0;
    border-bottom:1px solid var(--line);overflow:hidden}
  header::before{content:'';position:absolute;top:-90px;right:-60px;width:230px;height:230px;
    background:radial-gradient(circle,rgba(240,188,78,.16),transparent 68%);pointer-events:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;position:relative}
  .wordmark{display:flex;align-items:center;gap:9px}
  .wordmark b{font-family:var(--display);font-weight:600;font-size:16.5px;color:var(--cream);letter-spacing:-.01em}
  .gear{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);color:var(--muted);
    display:grid;place-items:center;background:rgba(36,31,23,.6)}
  .gear:active{color:var(--gold);border-color:var(--gold)}

  .whobar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;position:relative}
  .whobar::-webkit-scrollbar{display:none}
  .who{padding:6px 13px;border-radius:100px;background:var(--surface2);border:1px solid var(--line);
    color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;transition:.15s}
  .who.on{background:linear-gradient(150deg,var(--gold-hi),var(--gold));border-color:var(--gold);
    color:#2E1E05;box-shadow:var(--glow)}

  .monthrow{display:flex;justify-content:center;position:relative;margin-bottom:16px}
  .monthpill{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:100px;
    background:rgba(36,31,23,.75);border:1px solid var(--line)}
  .monthpill button{width:30px;height:30px;border-radius:50%;color:var(--muted);
    display:grid;place-items:center;transition:.15s}
  .monthpill button:active{background:var(--gold);color:#2E1E05}
  .monthpill span{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
    color:var(--cream);min-width:118px;text-align:center}
  .todayBtn{position:absolute;right:0;top:5px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--gold);font-weight:700;padding:5px 2px}

  .eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    font-weight:700;position:relative;display:flex;align-items:center;gap:8px}
  .tense{padding:2px 7px;border-radius:100px;font-size:9px;letter-spacing:.1em;border:1px solid var(--line);
    color:var(--muted);background:var(--surface2)}
  .total{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1.02;margin-top:2px;position:relative;
    background:linear-gradient(100deg,var(--gold-lo) 0%,var(--gold) 20%,var(--gold-hi) 38%,#FFFDF2 46%,
      var(--gold-hi) 54%,var(--gold) 72%,var(--gold-lo) 100%);
    background-size:320% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:sheen 6s ease-in-out infinite;
    filter:drop-shadow(0 2px 18px rgba(240,188,78,.28))}
  .total.neg{background:none;-webkit-text-fill-color:var(--red);color:var(--red);animation:none;
    filter:drop-shadow(0 2px 16px rgba(236,114,89,.3))}
  @keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .subtotal{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;position:relative}
  .subtotal b{color:var(--cream);font-weight:600}
  .proj{font-size:12.5px;color:var(--muted);margin-top:6px;position:relative}
  .proj b{color:var(--gold);font-weight:700}
  .proj b.bad{color:var(--red)}
  .flag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 12px;border-radius:100px;
    background:linear-gradient(140deg,rgba(240,188,78,.22),rgba(240,188,78,.08));
    border:1px solid rgba(240,188,78,.45);color:var(--gold-hi);
    font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;position:relative}
  .hpad{height:20px}
  header.past .total{filter:none;opacity:.82}

  /* ================= sections ================= */
  main{max-width:640px;margin:0 auto}
  .sec-head{display:flex;justify-content:space-between;align-items:center;padding:28px 20px 11px;
    font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .sec-head .lbl{display:flex;align-items:center;gap:9px}
  .sec-head .tick{width:3px;height:13px;border-radius:2px;background:var(--line)}
  .sec-head.in .tick{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo))}
  .sec-head.in{color:var(--gold)}
  .sec-head .num{color:var(--cream);letter-spacing:.02em;font-size:13px;font-weight:700}
  .sec-sub{padding:0 20px 10px;margin-top:-6px;font-size:11px;color:var(--muted);
    display:flex;align-items:center;gap:9px}
  .minibar{flex:1;height:3px;border-radius:2px;background:var(--surface2);overflow:hidden;max-width:120px}
  .minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-lo),var(--gold))}

  .rows{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .rows.income{background:linear-gradient(180deg,rgba(240,188,78,.07),rgba(240,188,78,.02))}
  .rows.jarred{background:linear-gradient(180deg,rgba(240,188,78,.05),transparent)}
  .row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:14px 20px;
    border-bottom:1px solid var(--line);transition:background .13s}
  .row:last-child{border-bottom:none}
  .row:active{background:var(--surface2)}
  .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;
    background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
  .ic.gold{background:linear-gradient(150deg,rgba(240,188,78,.28),rgba(240,188,78,.08));
    border-color:rgba(240,188,78,.42);color:var(--gold-hi)}
  .ic.paid{border-color:rgba(134,201,154,.4);color:var(--green)}
  .row-main{flex:1;min-width:0}
  .row-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
  .row-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .row-meta .paidtag{color:var(--green);font-weight:600}
  .row-meta .shared{color:var(--gold);opacity:.9}
  .row-amt{text-align:right;white-space:nowrap;font-weight:700;letter-spacing:-.015em}
  .row-amt.in{color:var(--gold)}
  .row-amt small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;letter-spacing:0}
  .row-amt small.x3{color:var(--gold-hi);font-weight:600}
  .row.skip{opacity:.38}

  .env{display:flex;gap:13px;width:100%;text-align:left;padding:15px 20px;border-bottom:1px solid var(--line)}
  .env:last-child{border-bottom:none}
  .env:active{background:var(--surface2)}
  .env-body{flex:1;min-width:0}
  .env-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .env-name{font-weight:600}
  .env-fig{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .env-fig b{color:var(--cream);font-weight:700}
  .track{height:6px;border-radius:4px;background:var(--surface2);margin-top:9px;overflow:hidden}
  .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-lo),var(--gold),var(--gold-hi));
    transition:width .45s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 12px -3px rgba(240,188,78,.7)}
  .fill.over{background:linear-gradient(90deg,#8A3626,var(--red));box-shadow:none}
  .env-note{font-size:11.5px;color:var(--muted);margin-top:7px}
  .env-note.over{color:var(--red);font-weight:600}

  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}
  .empty svg{opacity:.5;margin-bottom:12px}
  .empty strong{display:block;color:var(--cream);font-weight:600;margin-bottom:5px;font-size:15.5px;
    font-family:var(--display)}

  /* ================= log ================= */
  .dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 7px;
    background:var(--void);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;color:var(--muted)}
  .dayhead b{color:var(--gold);font-weight:700;letter-spacing:.02em;font-size:12px}

  /* ================= chart ================= */
  .outlook{padding:6px 20px 30px}
  .ranges{display:flex;gap:5px}
  .ranges button{padding:4px 11px;border-radius:100px;background:var(--surface2);
    border:1px solid var(--line);color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.06em}
  .ranges button.on{background:linear-gradient(150deg,var(--gold-hi),var(--gold));
    border-color:var(--gold);color:#2E1E05}
  .balsvg{display:block;width:100%;height:172px;overflow:visible}
  .chartfoot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:11.5px;color:var(--muted)}
  .chartfoot b{display:block;color:var(--gold);font-weight:700;font-size:15px;
    font-variant-numeric:tabular-nums;margin-top:3px}
  .chartfoot b.bad{color:var(--red)}
  .chartfoot>div:last-child{text-align:right}

  /* ================= goals ================= */
  .goal{background:linear-gradient(155deg,rgba(240,188,78,.09),var(--surface) 46%);
    border:1px solid var(--line);border-radius:20px;margin:0 20px 4px;padding:18px;
    display:flex;gap:16px;align-items:flex-start;position:relative;overflow:hidden}
  .goal::after{content:'';position:absolute;top:-50px;right:-50px;width:150px;height:150px;
    background:radial-gradient(circle,rgba(240,188,78,.13),transparent 70%);pointer-events:none}
  .jarwrap{flex:0 0 104px;position:relative}
  .jar{display:block;width:104px;height:148px}
  .goal-body{flex:1;min-width:0;padding-top:2px;position:relative}
  .goal-name{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.015em;
    line-height:1.15;word-break:break-word}
  .goal-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
  .goal-saved{margin-top:13px}
  .goal-saved b{font-size:27px;font-weight:700;letter-spacing:-.03em;
    background:linear-gradient(120deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .goal-saved small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  .pill{display:inline-block;margin-top:12px;padding:3px 10px;border-radius:100px;font-size:10px;
    font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .pill.ok{background:rgba(134,201,154,.16);color:var(--green);border:1px solid rgba(134,201,154,.4)}
  .pill.behind{background:rgba(236,114,89,.14);color:var(--red);border:1px solid rgba(236,114,89,.4)}
  .pill.none{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
  .pace{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.42}
  .goal-acts{display:flex;gap:8px;margin:8px 20px 20px}
  .goal-acts button{flex:1;padding:11px 6px;border-radius:11px;background:var(--surface2);
    border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--cream);
    display:flex;align-items:center;justify-content:center;gap:6px}
  .goal-acts button:active{border-color:var(--gold);color:var(--gold)}

  /* ================= buttons / nav ================= */
  .add{display:flex;align-items:center;justify-content:center;gap:9px;width:calc(100% - 40px);
    margin:20px;padding:16px;border-radius:14px;
    background:linear-gradient(155deg,var(--gold-hi) 0%,var(--gold) 42%,var(--gold-lo) 100%);
    color:#2E1E05;font-weight:700;letter-spacing:.01em;
    box-shadow:0 8px 26px -10px rgba(240,188,78,.75),inset 0 1px 0 rgba(255,255,255,.4)}
  .add:active{transform:translateY(1px)}

  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;
    background:rgba(16,13,10,.93);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:11px 4px 10px;font-size:9.5px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);position:relative;
    display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .15s}
  nav button.on{color:var(--gold)}
  nav button.on::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:30px;height:2px;background:var(--gold);border-radius:0 0 3px 3px;box-shadow:var(--glow)}

  /* ================= motion ================= */
  section.view{animation:viewin .22s ease}
  @keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .total{animation:none}.sheet,.scrim,section.view{animation:none}
    .fill,.b,.who{transition:none}
  }

  /* ================= sheets ================= */
  .scrim{position:fixed;inset:0;background:rgba(6,4,3,.76);z-index:40;display:flex;align-items:flex-end;
    animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--surface);width:100%;max-width:640px;margin:0 auto;
    padding:8px 20px calc(24px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;
    border-top:1px solid rgba(240,188,78,.3);max-height:93vh;overflow-y:auto;
    animation:up .28s cubic-bezier(.2,.9,.3,1);box-shadow:0 -20px 50px -20px rgba(0,0,0,.8)}
  @keyframes up{from{transform:translateY(26px)}to{transform:none}}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet h2{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
  .sheet .sub{font-size:12.5px;color:var(--muted);margin:0 0 6px}

  .amtwrap{display:flex;align-items:center;justify-content:center;gap:2px;margin:16px 0 4px}
  .amtwrap span{font-size:27px;font-weight:600;color:var(--gold-lo)}
  input.big{width:auto;max-width:100%;background:none;border:none;padding:6px 0;font-size:54px;
    font-weight:700;letter-spacing:-.045em;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums;
    filter:drop-shadow(0 2px 14px rgba(240,188,78,.3))}
  input.big:focus{outline:none}
  input.big::placeholder{color:#3A3021}

  label{display:block;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
    font-weight:700;margin:20px 0 8px}
  input.txt,select,input[type=date]{width:100%;padding:13px 14px;background:var(--surface2);
    border:1px solid var(--line);border-radius:12px;color:var(--cream)}
  input.txt:focus,select:focus,input[type=date]:focus{outline:none;border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(240,188,78,.14)}
  input.txt::placeholder{color:#635745}
  .hint{font-size:11.5px;color:var(--muted);margin:8px 0 0;text-transform:none;letter-spacing:0;font-weight:400}
  .twodates{display:flex;gap:10px}
  .twodates>div{flex:1}
  .twodates label{margin-top:0}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:9px 14px;border-radius:100px;background:var(--surface2);border:1px solid var(--line);
    color:var(--muted);font-size:13.5px;font-weight:600;transition:.14s}
  .chip.on{background:linear-gradient(150deg,var(--gold-hi),var(--gold));border-color:var(--gold);
    color:#2E1E05;box-shadow:var(--glow)}
  .chip.ghost{border-style:dashed}

  .seg{display:flex;gap:7px}
  .seg button{flex:1;padding:13px;border-radius:12px;background:var(--surface2);
    border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:700;transition:.14s}
  .seg button.on{background:linear-gradient(150deg,rgba(240,188,78,.26),rgba(240,188,78,.1));
    border-color:var(--gold);color:var(--gold-hi)}
  .seg.plain button.on{background:var(--surface2);border-color:var(--cream);color:var(--cream)}

  .more{margin-top:18px;font-size:12.5px;color:var(--gold);text-align:center;padding:9px;font-weight:600}
  .sheet-actions{display:flex;gap:10px;margin-top:22px}
  .sheet-actions button{flex:1;padding:15px;font-weight:700;border-radius:13px}
  .btn-primary{background:linear-gradient(155deg,var(--gold-hi),var(--gold) 42%,var(--gold-lo));color:#2E1E05;
    box-shadow:0 8px 24px -12px rgba(240,188,78,.8),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn-cancel{flex:0 0 96px !important;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
  .btn-del{margin-top:14px;width:100%;padding:13px;color:var(--red);font-size:13px;font-weight:600}

  /* ================= auth / onboarding ================= */
  #auth,#onboard{max-width:400px;margin:0 auto;padding:13vh 26px 26px;text-align:center}
  #onboard{padding-top:11vh}
  #auth .nug,#onboard .nug{margin:0 auto 20px;display:block;filter:drop-shadow(0 6px 26px rgba(240,188,78,.4))}
  .brand{font-family:var(--display);font-weight:600;font-size:34px;letter-spacing:-.025em;line-height:1.1}
  .brand-sub{color:var(--muted);font-size:14.5px;margin:8px 0 30px}
  #auth label,#onboard label{text-align:left}
  .msg{margin-top:15px;font-size:13px;color:var(--red);min-height:19px}
  .loading{padding:70px 20px;text-align:center;color:var(--muted);font-size:13.5px}
  .ob-big{display:block;width:100%;padding:16px;border-radius:13px;font-weight:700;margin-bottom:11px}
  .ob-big.btn-cancel{flex:none !important}
  input.code{text-align:center;font-size:27px;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;padding:16px 10px;color:var(--gold)}
  .codebox{background:var(--surface2);border:1px dashed var(--gold);border-radius:13px;padding:20px;
    font-size:31px;font-weight:700;letter-spacing:.3em;color:var(--gold);text-align:center;text-indent:.3em;
    box-shadow:inset 0 0 30px -10px rgba(240,188,78,.4)}
  .invitefoot{padding:0 20px 36px;text-align:center;color:var(--muted);font-size:12px}
  .invitefoot b{color:var(--gold);letter-spacing:.22em;font-weight:700;margin-left:5px}
</style>
</head>
<body>

<section id="auth" class="hide">
  <svg class="nug" width="88" height="88" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="ga" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#FFF1C2"/><stop offset=".55" stop-color="#F0BC4E"/><stop offset="1" stop-color="#96681E"/>
    </linearGradient></defs>
    <polygon fill="url(#ga)" points="32.0,8.7 43.6,14.8 56.8,19.9 56.3,32.5 55.9,44.6 43.1,49.4 32.0,55.8 17.4,54.7 11.4,43.0 3.9,32.5 12.4,22.5 19.0,12.7"/>
    <polygon fill="#FFF9E4" opacity=".38" points="32.0,8.7 19.0,12.7 12.4,22.5 32,32.5"/>
    <polygon fill="#000" opacity=".18" points="55.9,44.6 43.1,49.4 32.0,55.8 32,32.5"/>
    <text x="32" y="39.5" text-anchor="middle" font-size="19" font-weight="700" fill="#3A2609" font-family="Space Grotesk,sans-serif">BN</text>
  </svg>

  const c = item.cadence, first = new Date(y,m,1), last = new Date(y,m+1,0), out = [];

    while (d < first) d.setDate(d.getDate() + step);

const memberCount = () => Math.max(1, state.members.length);
function share(item) {
  if (state.who === 'all') return 1;
  if (item.owner_id === state.who) return 1;
  if (!item.owner_id) return 1 / memberCount();
  return 0;
}
function txShare(t) {
  if (state.who === 'all') return 1;
  const o = t.owner_id || t.entered_by;
  if (o === state.who) return 1;
  if (!o) return 1 / memberCount();
  return 0;
}
const amountIn = (i,y,m) => Number(i.amount) * occurrences(i,y,m) * share(i);

function totals(y, m) {
  let inc = 0, bill = 0, env = 0, goal = 0;
  for (const it of itemsFor(y, m)) {
    const v = amountIn(it, y, m);
    if (it.type === 'income') inc += v;
    else if (it.goal_id) goal += v;
    else if (it.kind === 'envelope') env += v;
    else bill += v;
  }
  return { inc:inc, bill:bill, env:env, goal:goal, out:bill+env+goal, left:inc-bill-env-goal };
}
function extraPaychecks(y, m) {
  return itemsFor(y,m).some(i => i.type === 'income' && i.anchor_date && share(i) > 0 &&
    (i.cadence === 'biweekly' || i.cadence === 'weekly') &&
    occurrences(i, y, m) > (i.cadence === 'biweekly' ? 2 : 4));
}
function goalSaved(g) {
  const t = today(), series = {};
  state.items.filter(i => i.goal_id === g.id).forEach(i => {
    const k = i.series_id || i.id;
    if (!series[k]) series[k] = [];
    series[k].push(i);
  });
  let acc = 0;
  Object.keys(series).forEach(k => {
    const vers = series[k];
    const starts = vers.map(v => v.anchor_date ? pd(v.anchor_date) : (v.created_at ? pd(v.created_at) : t));
    let start = starts.sort((a,b) => a-b)[0];
    if (start > t) return;
    let y = start.getFullYear(), m = start.getMonth(), guard = 0;
    while ((y < t.getFullYear() || (y === t.getFullYear() && m <= t.getMonth())) && guard++ < 600) {
      const v = vers.find(x => activeIn(x, y, m));
      if (v) {
        const floor = new Date(Math.max(start.getTime(), pd(v.effective_from || '2000-01-01').getTime()));
        const ds = occDates(v, y, m), per = Number(v.amount) * share(v);
        if (ds === null) acc += per * AVG[v.cadence];
        else acc += ds.filter(d => d <= t && d >= floor).length * per;
      }
      m++; if (m > 11) { m = 0; y++; }
    }
  });
  state.goalTx.filter(x => x.goal_id === g.id).forEach(x => { acc -= Number(x.amount) * txShare(x); });
  return acc;
}
const goalMonthly = g => itemsFor(state.y, state.m)
  .filter(i => i.goal_id === g.id && i.cadence !== 'once')
  .reduce((s,i) => s + Number(i.amount) * AVG[i.cadence] * share(i), 0);
const goalHasRecurring = g => state.items
  .some(i => i.goal_id === g.id && i.cadence !== 'once' && isCurrent(i) && share(i) > 0);

/* ================= load ================= */
async function start() {
  const u = await sb.auth.getUser();
  state.me = u.data.user ? u.data.user.id : null;
  const r = await sb.from('household_members').select('*');
  if (!r.data || !r.data.length) { showOnboarding(); return; }
  $('onboard').classList.add('hide');
  $('app').classList.remove('hide');
  state.members = r.data;
  state.household = r.data[0].household_id;
  const h = await sb.from('households').select('*').eq('id', state.household).limit(1);
  state.home = (h.data && h.data[0]) || null;
  renderWhoBar();
  await refresh();
  loadInviteCode();
  sb.channel('live')
    .on('postgres_changes', { event:'*', schema:'public', table:'line_items' }, refresh)
    .on('postgres_changes', { event:'*', schema:'public', table:'transactions' }, refresh)
    .on('postgres_changes', { event:'*', schema:'public', table:'goals' }, refresh)
    .subscribe();
}

function renderWhoBar() {
  const bar = $('whobar');
  if (state.members.length < 2) { bar.classList.add('hide'); return; }
  bar.classList.remove('hide');
  const opts = [['all','Household']].concat(
    state.members.map(m => [m.user_id, m.user_id === state.me ? 'Just me' : m.display_name]));
  bar.innerHTML = opts.map(o =>
    '<button class="who'+(state.who===o[0]?' on':'')+'" data-who="'+esc(o[0])+'">'+esc(o[1])+'</button>').join('');
  bar.querySelectorAll('[data-who]').forEach(b => b.onclick = () => {
    state.who = b.dataset.who; renderWhoBar(); render();
  });
}

async function refresh() {
  const from = iso(new Date(state.y, state.m, 1)), to = iso(new Date(state.y, state.m+1, 0));
  const res = await Promise.all([
    sb.from('line_items').select('*').eq('is_active', true).order('created_at'),
    sb.from('transactions').select('*').is('goal_id', null)
      .gte('occurred_on', from).lte('occurred_on', to).order('occurred_on', { ascending:false }),
    sb.from('goals').select('*').eq('is_active', true).order('created_at'),
    sb.from('transactions').select('*').not('goal_id','is',null).order('occurred_on', { ascending:false })
  ]);
  const err = res.find(r => r.error);
  if (err) {
    console.error(err.error);
    $('flagWrap').innerHTML = '<span class="flag" style="background:rgba(236,114,89,.16);'+
      'border-color:rgba(236,114,89,.5);color:#EC7259">'+esc(err.error.message)+'</span>';
  }
  state.items  = res[0].data || [];
  state.tx     = res[1].data || [];
  state.goals  = res[2].data || [];
  state.goalTx = res[3].data || [];
  render();
}

/* ================= number animation ================= */
let lastTotal = null;
function animateTotal(el, to) {
  const from = lastTotal;
  lastTotal = to;
  if (from === null || from === to || reduced()) { el.textContent = money(to); return; }
  const dur = 450, t0 = performance.now();
  const step = ts => {
    const p = Math.min(1, (ts - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = money(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ================= render ================= */
function render() {
  const y = state.y, m = state.m, t = totals(y, m);
  const thisMonth = (y === now.getFullYear() && m === now.getMonth());
  const isPast = new Date(y,m,1) < new Date(now.getFullYear(), now.getMonth(), 1);
  const personal = state.who !== 'all';

  $('mLabel').textContent = new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  $('todayBtn').classList.toggle('hide', thisMonth);
  $('hdr').classList.toggle('past', isPast);
  $('tense').innerHTML = thisMonth ? '' :
    '<span class="tense">'+(isPast ? 'Past' : 'Projected')+'</span>';

  animateTotal($('totalNum'), t.left);
  $('totalNum').className = 'total num' + (t.left < 0 ? ' neg' : '');
  $('totalLabel').textContent = (t.left < 0 ? 'Short this month' : 'Left over this month') +
    (personal ? ' — ' + (state.who === state.me ? 'you' : nameOf(state.who)) : '');
  $('totalSub').innerHTML =
    '<span>In <b class="num">'+money(t.inc)+'</b></span>'+
    '<span>Out <b class="num">'+money(t.out)+'</b></span>'+
    (t.goal ? '<span>Jarred <b class="num">'+money(t.goal)+'</b></span>' : '');

  const endBal = balanceEnd(y, m);
  $('projWrap').innerHTML = endBal === null ? '' :
    '<div class="proj">Account at the end of '+new Date(y,m,1).toLocaleDateString('en-US',{month:'long'})+
    ': <b class="'+(endBal<0?'bad':'')+'">'+money(endBal)+'</b></div>';
  $('flagWrap').innerHTML = extraPaychecks(y,m)
    ? '<span class="flag">'+icon('cash',13)+'Three-paycheck month</span>' : '';

  const vis = i => share(i) > 0;
  const live = itemsFor(y, m);
  const income = live.filter(i => i.type === 'income' && vis(i));
  const bills  = live.filter(i => i.type === 'expense' && !i.goal_id && i.kind !== 'envelope' && vis(i));
  const envs   = live.filter(i => i.type === 'expense' && !i.goal_id && i.kind === 'envelope' && vis(i));
  const contrib= live.filter(i => i.goal_id && vis(i));

  $('inSum').textContent   = money(t.inc);
  $('billSum').textContent = money(t.bill);
  $('envSum').textContent  = money(t.env);
  $('goalSum').textContent = money(t.goal);
  $('putHead').classList.toggle('hide', !contrib.length);
  $('goalContribRows').classList.toggle('hide', !contrib.length);

  plainRows('incomeRows', income, 'jar', 'Nothing coming in', 'Add a paycheck or a one-off.');
  billRows('billRows', bills, y, m, isPast);
  envelopeRows('envRows', envs, y, m, thisMonth);
  plainRows('goalContribRows', contrib, null, '', '');

  renderRanges();
  renderBalance();
  renderLog(y, m);
  renderGoals();
}

function emptyBlock(title, body) {
  return '<div class="empty">'+
    '<svg width="42" height="42" viewBox="0 0 64 64" aria-hidden="true">'+
    '<polygon fill="none" stroke="#F0BC4E" stroke-width="2.4" stroke-linejoin="round" '+
    'points="32,8.7 43.6,14.8 56.8,19.9 56.3,32.5 55.9,44.6 43.1,49.4 32,55.8 17.4,54.7 11.4,43 3.9,32.5 12.4,22.5 19,12.7"/></svg>'+
    '<strong>'+title+'</strong>'+body+'</div>';
}

function ownerTag(i) {
  const older = isCurrent(i) ? '' : ' &middot; <span class="shared">was</span>';
  if (state.members.length < 2) return older;
  if (!i.owner_id) return ' &middot; <span class="shared">shared</span>' + older;
  return ' &middot; ' + esc(i.owner_id === state.me ? 'you' : nameOf(i.owner_id)) + older;
}

function plainRows(target, list, _u, emptyTitle, emptyBody) {
  const y = state.y, m = state.m;
  if (!list.length) {
    $(target).innerHTML = emptyTitle ? emptyBlock(emptyTitle, emptyBody) : '';
    return;
  }
  $(target).innerHTML = list.map(i => {
    const n = occurrences(i,y,m), whole = Number.isInteger(n), inc = i.type === 'income';
    const g = i.goal_id ? state.goals.find(x => x.id === i.goal_id) : null;
    const dates = occDates(i,y,m);
    let sub;
    if (n === 0) sub = 'not this month';
    else if (!whole) sub = 'averaged &mdash; set a date';
    else if (dates && dates.length && n <= 2)
      sub = dates.map(d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'})).join(', ');
    else sub = '&times;'+n+' &middot; '+money(Number(i.amount)*n);
    const fat = whole && ((i.cadence==='biweekly'&&n>2)||(i.cadence==='weekly'&&n>4));
    const k = g ? 'jar' : iconKey(i.name, i.category, i.type);
    return '<button class="row'+(n===0?' skip':'')+'" data-item="'+i.id+'">'+
      '<span class="ic'+(inc||g?' gold':'')+'">'+icon(k)+'</span><div class="row-main">'+
      '<div class="row-name">'+esc(i.name)+'</div><div class="row-meta">'+
      esc(g ? g.name : i.category)+ownerTag(i)+'</div></div>'+
      '<div class="row-amt'+(inc?' in':'')+'">'+money2(Number(i.amount))+
      '<small class="'+(fat?'x3':'')+'">'+sub+'</small></div></button>';
  }).join('');
}

function billRows(target, list, y, m, isPast) {
  if (!list.length) {
    $(target).innerHTML = emptyBlock('No bills yet','Rent, insurance, subscriptions &mdash; the ones you do not decide each month.');
    $('billProgress').innerHTML = '';
    return;
  }
  let paid = 0, due = 0;
  const html = list.map(i => {
    const dates = occDates(i,y,m), n = occurrences(i,y,m);
    const done = isPast ? n : occurredSoFar(i,y,m);
    if (n > 0) { due += n; paid += Math.min(done, n); }
    let meta;
    if (n === 0) meta = 'not due this month';
    else if (done >= n) meta = '<span class="paidtag">&#10003; paid</span>';
    else if (dates && dates.length) {
      const next = dates.filter(d => d > today())[0];
      meta = next ? 'due ' + next.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : 'due';
      if (done > 0) meta = done+' of '+n+' paid &middot; '+meta;
    } else meta = 'scheduled';
    const settled = n > 0 && done >= n;
    return '<button class="row'+(n===0?' skip':'')+'" data-item="'+i.id+'">'+
      '<span class="ic'+(settled?' paid':'')+'">'+icon(iconKey(i.name,i.category,i.type))+'</span>'+
      '<div class="row-main"><div class="row-name">'+esc(i.name)+'</div>'+
      '<div class="row-meta">'+meta+ownerTag(i)+'</div></div>'+
      '<div class="row-amt">'+money2(Number(i.amount))+
      (n>1?'<small>&times;'+n+' &middot; '+money(Number(i.amount)*n)+'</small>':'')+'</div></button>';
  }).join('');
  $(target).innerHTML = html;
  const pct = due ? Math.round(paid/due*100) : 0;
  $('billProgress').innerHTML = due
    ? '<span>'+paid+' of '+due+' paid</span><span class="minibar"><i style="width:'+pct+'%"></i></span>' : '';
}

function envelopeRows(target, list, y, m, thisMonth) {
  if (!list.length) {
    $(target).innerHTML = emptyBlock('No envelopes yet','Groceries, gas, fun &mdash; the ones that vary. Without these the forecast is optimistic.');
    return;
  }
  const daysLeft = thisMonth ? (new Date(y,m+1,0).getDate() - now.getDate()) : 0;
  $(target).innerHTML = list.map(i => {
    const planned = amountIn(i,y,m);
    const actual = state.tx.filter(t => t.category === i.category)
      .reduce((s,t) => s + Number(t.amount) * txShare(t), 0);
    const pct = planned > 0 ? Math.min(100, actual/planned*100) : (actual > 0 ? 100 : 0);
    const over = planned > 0 && actual > planned;
    let note;
    if (planned === 0) note = 'nothing budgeted';
    else if (over) note = money2(actual-planned)+' over';
    else note = money2(planned-actual)+' left'+(thisMonth && daysLeft>0 ? ' &middot; '+daysLeft+' days to go' : '');
    return '<button class="env" data-item="'+i.id+'">'+
      '<span class="ic'+(over?'':' gold')+'">'+icon(iconKey(i.name,i.category,i.type))+'</span>'+
      '<div class="env-body"><div class="env-top"><span class="env-name">'+esc(i.name)+'</span>'+
      '<span class="env-fig"><b>'+money2(actual)+'</b> of '+money2(planned)+'</span></div>'+
      '<div class="track"><div class="fill'+(over?' over':'')+'" style="width:'+pct+'%"></div></div>'+
      '<div class="env-note'+(over?' over':'')+'">'+note+'</div></div></button>';
  }).join('');
}

/* ================= log, grouped by day ================= */
function renderLog(y, m) {
  const visTx = state.tx.filter(x => txShare(x) > 0);
  const spent = visTx.reduce((s,x) => s + Number(x.amount) * txShare(x), 0);
  $('logMonth').textContent = new Date(y,m,1).toLocaleDateString('en-US',{month:'long'});
  $('logSum').textContent = money2(spent);
  if (!visTx.length) {
    $('txRows').innerHTML = '<div class="rows">'+
      emptyBlock('Nothing logged yet','Only envelope spending goes here. Bills take care of themselves.')+'</div>';
    return;
  }
  const days = {};
  visTx.forEach(x => { (days[x.occurred_on] = days[x.occurred_on] || []).push(x); });
  const keys = Object.keys(days).sort().reverse();
  const t = today(), yst = new Date(t); yst.setDate(yst.getDate()-1);
  $('txRows').innerHTML = keys.map(k => {
    const d = pd(k), rows = days[k];
    const sum = rows.reduce((s,x) => s + Number(x.amount) * txShare(x), 0);
    let label;
    if (d.getTime() === t.getTime()) label = 'Today';
    else if (d.getTime() === yst.getTime()) label = 'Yesterday';
    else label = d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
    return '<div class="dayhead"><span>'+label+'</span><b class="num">'+money2(sum)+'</b></div>'+
      '<div class="rows">'+rows.map(x => {
        const who = state.members.length > 1 ? ' &middot; ' + esc(nameOf(x.owner_id || x.entered_by)) : '';
        return '<button class="row" data-tx="'+x.id+'">'+
          '<span class="ic">'+icon(iconKey(x.description, x.category))+'</span>'+
          '<div class="row-main"><div class="row-name">'+esc(x.description || x.category)+'</div>'+
          '<div class="row-meta">'+esc(x.category)+who+'</div></div>'+
          '<div class="row-amt">'+money2(Number(x.amount))+'</div></button>';
      }).join('')+'</div>';
  }).join('');
}

function jarSvg(pct, id) {
  const YTOP = 36, YBOT = 150;
  const line = YBOT - (YBOT - YTOP) * Math.max(0, Math.min(1, pct));
  const nugs = NUGS.filter(n => n[1] >= line - 3).map(n => {
    const x = n[0], y = n[1], r = n[2], rot = n[3], pts = [];
    const offs = [1,.82,1.06,.88,1.02,.86];
    for (let j = 0; j < 6; j++) {
      const a = (j/6)*Math.PI*2 + rot*Math.PI/180;
      pts.push((x + Math.cos(a)*r*offs[j]).toFixed(1) + ',' + (y + Math.sin(a)*r*offs[j]*.9).toFixed(1));
    }
    return '<polygon points="'+pts.join(' ')+'" fill="url(#ng'+id+')" stroke="#6E4A11" stroke-width=".6"/>'+
      '<circle cx="'+(x-r*.28).toFixed(1)+'" cy="'+(y-r*.32).toFixed(1)+'" r="'+(r*.22).toFixed(1)+'" fill="#FFF8E0" opacity=".6"/>';
  }).join('');
  return '<svg class="jar" viewBox="0 0 120 170" aria-hidden="true">'+
    '<defs>'+
      '<linearGradient id="ng'+id+'" x1="0" y1="0" x2=".4" y2="1">'+
        '<stop offset="0" stop-color="#FFF1C2"/><stop offset=".5" stop-color="#F0BC4E"/><stop offset="1" stop-color="#96681E"/></linearGradient>'+
      '<linearGradient id="gl'+id+'" x1="0" y1="0" x2="1" y2="0">'+
        '<stop offset="0" stop-color="#ffffff" stop-opacity=".2"/><stop offset=".28" stop-color="#ffffff" stop-opacity=".05"/>'+
        '<stop offset=".72" stop-color="#ffffff" stop-opacity=".03"/><stop offset="1" stop-color="#ffffff" stop-opacity=".14"/></linearGradient>'+
      '<clipPath id="cp'+id+'"><path d="M16 40 Q16 32 24 30 L96 30 Q104 32 104 40 L104 142 Q104 154 92 154 L28 154 Q16 154 16 142 Z"/></clipPath>'+
    '</defs>'+
    '<rect x="30" y="12" width="60" height="9" rx="4" fill="#54401F"/>'+
    '<rect x="26" y="19" width="68" height="11" rx="4" fill="#6B5227"/>'+
    '<g clip-path="url(#cp'+id+')"><rect x="14" y="28" width="92" height="128" fill="#1C1710"/>'+nugs+'</g>'+
    '<path d="M16 40 Q16 32 24 30 L96 30 Q104 32 104 40 L104 142 Q104 154 92 154 L28 154 Q16 154 16 142 Z" fill="url(#gl'+id+')" stroke="#7A6743" stroke-width="2"/>'+
    '<rect x="24" y="44" width="6" height="86" rx="3" fill="#ffffff" opacity=".12"/></svg>';
}

function renderGoals() {
  const total = state.goals.reduce((s,g) => s + goalSaved(g), 0);
  $('goalsTotal').textContent = money(total);

    $('goalCards').innerHTML = emptyBlock('Nothing saved for yet',
      'A trip, a new GPU, next year&rsquo;s insurance. Money you put here leaves the month and waits in the jar.');
    return;
  }
  const t = today();
  $('goalCards').innerHTML = state.goals.map((g,idx) => {
    const saved = goalSaved(g), target = Number(g.target_amount) || 0, per = goalMonthly(g);
    const recurring = goalHasRecurring(g);
    const pct = target > 0 ? saved/target : (saved > 0 ? .35 : 0);
    let sub = '', pace = '', pill = '';
    if (target > 0 && g.target_date) {
      const td = pd(g.target_date);
      const months = Math.max(0, (td.getFullYear()-t.getFullYear())*12 + (td.getMonth()-t.getMonth()));
      const need = months > 0 ? (target-saved)/months : Math.max(0, target-saved);
      sub = 'by ' + td.toLocaleDateString('en-US',{month:'long',year:'numeric'});
      if (saved >= target) { pill = '<span class="pill ok">Funded</span>'; pace = 'Go book it.'; }
      else if (months === 0) { pill = '<span class="pill behind">Due now</span>'; pace = money(target-saved)+' still short.'; }
      else if (!recurring) { pill = '<span class="pill none">By hand</span>';
        pace = money(need)+'/mo would get you there, or keep dropping in lump sums.'; }
      else if (per >= need - 0.5) { pill = '<span class="pill ok">On pace</span>';
        pace = money(per)+'/mo covers the '+money(need)+'/mo you need.'; }
      else { pill = '<span class="pill behind">Behind</span>';
        pace = 'Needs '+money(need)+'/mo, putting away '+money(per)+'.'; }
    } else if (target > 0) {
      sub = 'no deadline';
      pill = saved >= target ? '<span class="pill ok">Funded</span>' : '<span class="pill none">No deadline</span>';
      pace = per > 0 ? money(per)+'/mo &middot; '+Math.ceil((target-saved)/per)+' months to go'
           : money(target-saved)+' to go.';
    } else {
      sub = 'open-ended';
      pill = '<span class="pill none">No target</span>';
      pace = per > 0 ? 'Putting away '+money(per)+'/mo.' : 'Add a contribution to start.';
    }
    return '<div><div class="goal">'+
      '<div class="jarwrap">'+jarSvg(pct, idx)+'</div>'+
      '<div class="goal-body"><div class="goal-name">'+esc(g.name)+'</div>'+
      '<div class="goal-sub">'+sub+'</div>'+
      '<div class="goal-saved"><b class="num">'+money(saved)+'</b>'+
      (target>0?'<small>of '+money(target)+'</small>':'<small>set aside</small>')+'</div>'+
      pill+'<div class="pace">'+pace+'</div></div></div>'+
      '<div class="goal-acts">'+
        '<button data-contrib="'+g.id+'">'+icon('cash',14)+'Put in</button>'+
        '<button data-spend="'+g.id+'">'+icon('cart',14)+'Spend</button>'+
        '<button data-goal="'+g.id+'">'+icon('tag',14)+'Edit</button></div></div>';
  }).join('');
}

/* ================= balance chart ================= */
function renderRanges() {
  const opts = [[6,'6M'],[12,'1Y'],[36,'3Y']];
  $('ranges').innerHTML = opts.map(o =>
    '<button data-range="'+o[0]+'" class="'+(state.range===o[0]?'on':'')+'">'+o[1]+'</button>').join('');
  $('ranges').querySelectorAll('[data-range]').forEach(b => b.onclick = () => {
    state.range = Number(b.dataset.range); renderRanges(); renderBalance();
  });
}
function renderBalance() {
  const n = state.range, pts = balanceSeries(n);
  const W = 320, H = 152, PADT = 16, PADB = 22;
  const vals = pts.map(p => p.bal);
  const hi = Math.max.apply(null, vals.concat([0]));
  const lo = Math.min.apply(null, vals.concat([0]));
  const span = (hi - lo) || 1;
  const x = k => n === 1 ? W/2 : (k/(n-1))*W;
  const yOf = v => PADT + (hi - v)/span * (H - PADT - PADB);
  const zeroY = yOf(0);

  let line = '';
  pts.forEach((p,k) => { line += (k ? ' L' : 'M') + x(k).toFixed(1) + ' ' + yOf(p.bal).toFixed(1); });
  const area = line + ' L' + x(n-1).toFixed(1) + ' ' + zeroY.toFixed(1) + ' L' + x(0).toFixed(1) + ' ' + zeroY.toFixed(1) + ' Z';

  const dots = pts.map((p,k) => {
    if (!(n <= 12 || k % 6 === 0 || k === n-1)) return '';
    return '<circle cx="'+x(k).toFixed(1)+'" cy="'+yOf(p.bal).toFixed(1)+'" r="'+(p.fat?3.6:2.4)+'" '+
      'fill="'+(p.bal<0?'#EC7259':(p.fat?'#FFF1C2':'#F0BC4E'))+'"/>';
  }).join('');

  const every = n <= 6 ? 1 : n <= 12 ? 2 : 6;
  const labels = pts.map((p,k) => {
    if (k % every !== 0 && k !== n-1) return '';
    const anchor = k === 0 ? 'start' : (k === n-1 ? 'end' : 'middle');
    const txt = n > 12 ? new Date(p.y,p.m,1).toLocaleDateString('en-US',{month:'short',year:'2-digit'})
                       : new Date(p.y,p.m,1).toLocaleDateString('en-US',{month:'short'});
    return '<text x="'+x(k).toFixed(1)+'" y="'+(H-5)+'" text-anchor="'+anchor+'" '+
      'fill="'+(p.fat?'#F0BC4E':'#A2937D')+'" font-size="9.5" font-weight="'+(p.fat?'700':'400')+'" '+
      'letter-spacing=".06em">'+txt+'</text>';
  }).join('');

  const dip = pts.filter(p => p.bal < 0)[0];
  $('balChart').innerHTML =
    '<svg class="balsvg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<defs><linearGradient id="ba" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0" stop-color="#F0BC4E" stop-opacity=".42"/>'+
      '<stop offset="1" stop-color="#F0BC4E" stop-opacity="0"/></linearGradient>'+
    '<filter id="lg"><feGaussianBlur stdDeviation="2.6" result="b"/>'+
      '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'+
    (lo < 0 ? '<rect x="0" y="'+zeroY.toFixed(1)+'" width="'+W+'" height="'+Math.max(0,H-PADB-zeroY).toFixed(1)+'" fill="#EC7259" opacity=".08"/>' : '')+
    '<line x1="0" y1="'+zeroY.toFixed(1)+'" x2="'+W+'" y2="'+zeroY.toFixed(1)+'" '+
      'stroke="'+(lo<0?'#EC7259':'#3A3021')+'" stroke-width="1" stroke-dasharray="3 3"/>'+
    '<path d="'+area+'" fill="url(#ba)"/>'+
    '<path d="'+line+'" fill="none" stroke="#F0BC4E" stroke-width="2.2" stroke-linejoin="round" '+
      'stroke-linecap="round" filter="url(#lg)"/>'+
    dots + labels + '</svg>';

  const last = pts[n-1];
  const endLabel = new Date(last.y,last.m,1).toLocaleDateString('en-US',{month:'short',year:'numeric'});
  $('chartFoot').innerHTML =
    '<div>'+(dip
      ? 'Runs out '+new Date(dip.y,dip.m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})+
        '<b class="bad">'+money(dip.bal)+'</b>'
      : 'Lowest point<b>'+money(Math.min.apply(null, vals))+'</b>')+'</div>'+
    '<div>By '+endLabel+'<b class="'+(last.bal<0?'bad':'')+'">'+money(last.bal)+'</b></div>';
}

const closeSheet = () => { $('modal').innerHTML = ''; };
function openSheet(html, wire) {
  $('modal').innerHTML = '<div class="scrim"><div class="sheet"><div class="grab"></div>'+html+'</div></div>';
  $('modal').querySelector('.scrim').addEventListener('click', e => {
    if (e.target.classList.contains('scrim')) closeSheet();
  });

function catList() {
  const freq = {};
  state.tx.forEach(t => freq[t.category] = (freq[t.category]||0)+1);
  state.items.forEach(i => { if (!i.goal_id && isCurrent(i)) freq[i.category] = (freq[i.category]||0)+1; });
  const used = Object.keys(freq).sort((a,b) => freq[b]-freq[a]);
  return used.concat(DEFAULT_CATS.filter(c => used.indexOf(c) === -1));
}
function normCat(v) {
  const t = String(v||'').trim().replace(/\s+/g,' ');
  if (!t) return 'Other';
  const hit = catList().find(c => c.toLowerCase() === t.toLowerCase());
  return hit || (t.charAt(0).toUpperCase() + t.slice(1));
}
function chipGroup(host, options, selected, onPick, allowNew) {
  const draw = () => {
    host.innerHTML = options.map(o => {
      const v = Array.isArray(o)?o[0]:o, l = Array.isArray(o)?o[1]:o;
      return '<button type="button" class="chip'+(v===selected?' on':'')+'" data-v="'+esc(v)+'">'+esc(l)+'</button>';
    }).join('') + (allowNew === false ? '' : '<button type="button" class="chip ghost" data-new="1">+ Other</button>');
    host.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
      selected = b.dataset.v === '__null' ? null : b.dataset.v; draw(); if (onPick) onPick(selected);
    });
    const nb = host.querySelector('[data-new]');
    if (nb) nb.onclick = () => {
      host.innerHTML = '<input class="txt" placeholder="Type a category">';
      const inp = host.querySelector('input'); inp.focus();
      inp.onblur = inp.onchange = () => {
        const v = normCat(inp.value);
        if (inp.value.trim()) { if (options.indexOf(v) === -1) options.unshift(v); selected = v; }
        draw(); if (onPick) onPick(selected);
      };
    };
  };
  draw();
  return () => selected;
}
const ownerOptions = () => [['__null','Shared']].concat(
  state.members.map(m => [m.user_id, m.user_id === state.me ? 'Me' : m.display_name]));

function itemSheet(item, presetGoalId) {
  const gid = item ? item.goal_id : (presetGoalId || null);
  const goal = gid ? state.goals.find(g => g.id === gid) : null;
  const it = item || { name:'', amount:'', type:'expense', kind:'bill', cadence:'monthly',

  openSheet(
    '<h2>'+(item ? 'Edit line' : goal ? 'Put money into '+esc(goal.name) : 'New line')+'</h2>'+

    '<div class="amtwrap"><span>$</span><input id="f-amt" class="big" type="number" inputmode="decimal" '+
      'step="0.01" value="'+it.amount+'" placeholder="0" size="5"></div>'+

      '<div class="seg plain" id="typeSeg" style="margin-top:10px">'+
      '<button type="button" data-type="expense" class="'+(it.type==='expense'?'on':'')+'">Money out</button>'+
      '<button type="button" data-type="income" class="'+(it.type==='income'?'on':'')+'">Money in</button></div>'+
      '<div id="kindWrap"><label>What kind</label><div class="seg" id="kindSeg">'+
      '<button type="button" data-kind="bill" class="'+(it.kind!=='envelope'?'on':'')+'">Bill</button>'+
      '<button type="button" data-kind="envelope" class="'+(it.kind==='envelope'?'on':'')+'">Envelope</button></div>'+
      '<p class="hint" id="kindHint"></p></div>')+
    '<label>How often</label><div class="chips" id="cadChips"></div>'+
    '<div id="anchorWrap"><div class="twodates">'+
      '<div><label for="f-anch" id="anchLabel">Date</label><input id="f-anch" type="date" value="'+(it.anchor_date||iso(new Date()))+'"></div>'+
      '<div id="anch2Wrap" class="hide"><label for="f-anch2">Second date</label>'+
      '<input id="f-anch2" type="date" value="'+(it.anchor_date2||'')+'"></div>'+
      '</div><p class="hint" id="anchHint"></p></div>'+
    '<label for="f-name">What is it</label>'+
    '<input id="f-name" class="txt" value="'+esc(it.name)+'" placeholder="'+(goal?'Monthly set-aside':'Rent, paycheck, groceries')+'">'+
    (goal ? '' : '<label>Category</label><div class="chips" id="catChips"></div>')+
    (state.members.length > 1 ? '<label>Whose</label><div class="chips" id="ownChips"></div>'+
      '<p class="hint">Shared lines split evenly in a personal view.</p>' : '')+
    (item && isCurrent(item) ?
      '<div id="scopeWrap" class="hide"><label>Apply the new numbers</label>'+
      '<div class="seg" id="scopeSeg">'+
      '<button type="button" data-scope="forward" class="on">From '+
        new Date(state.y,state.m,1).toLocaleDateString('en-US',{month:'short',year:'numeric'})+' on</button>'+
      '<button type="button" data-scope="all">Everywhere</button></div>'+
      '<p class="hint" id="scopeHint"></p></div>' : '')+
    '<p class="msg" id="f-err"></p>'+
    '<div class="sheet-actions"><button class="btn-cancel" id="f-cancel">Cancel</button>'+
    '<button class="btn-primary" id="f-save">Save</button></div>'+
    (item ? '<button class="btn-del" id="f-del">Delete this line</button>' : ''),
  function () {
    let type = it.type, kind = it.kind || 'bill';
    if (!goal) {
      const syncKind = () => {
        $('kindWrap').classList.toggle('hide', type === 'income');
        $('kindHint').textContent = kind === 'envelope'
          ? 'A spending budget. Log purchases against it.'
          : 'Fixed and predictable. Marks itself paid on its date.';
      };
      $('typeSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
        type = b.dataset.type;
        $('typeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
        syncKind();
      });
      $('kindSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
        kind = b.dataset.kind;
        $('kindSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
        syncKind();
      });
      syncKind();
    }
    const syncAnchor = c => {
      $('anch2Wrap').classList.toggle('hide', c !== 'semimonthly');
      $('anchLabel').textContent =
        c === 'once' ? 'When' : c === 'semimonthly' ? 'First date' :
        c === 'monthly' ? 'Day of the month' : 'A date it lands';
      $('anchHint').textContent =
        c === 'once' ? 'Counts in that month only.'
      : c === 'semimonthly' ? 'Two fixed days each month — the 1st and 15th, say.'
      : c === 'monthly' ? 'The day it comes out. Used to mark it paid.'
      : c === 'biweekly' ? 'Any real payday. Some months get three.'
      : c === 'weekly' ? 'Any date it hits. Some months get five.'
      : c === 'quarterly' ? 'The first time it is due.'
      : 'The month and day it is due.';
      if (c === 'semimonthly' && !$('f-anch2').value) {
        const d = new Date(); d.setDate(15); $('f-anch2').value = iso(d);
      }
    };
    const getCad = chipGroup($('cadChips'), CAD.slice(), it.cadence, c => { syncAnchor(c); syncScope(); });
    syncAnchor(it.cadence);
    const getCat = goal ? (() => null) : chipGroup($('catChips'), catList(), it.category||null, null);
    const getOwn = state.members.length > 1
      ? chipGroup($('ownChips'), ownerOptions(), it.owner_id || '__null', null, false)
      : (() => null);

    let scope = 'forward';
    const material = () => item && (
      Number($('f-amt').value) !== Number(item.amount) ||
      getCad() !== item.cadence ||
      ($('f-anch').value || null) !== (item.anchor_date || null) ||
      (getCad() === 'semimonthly' && ($('f-anch2').value || null) !== (item.anchor_date2 || null)));
    function syncScope() {
      if (!$('scopeWrap')) return;
      const show = material();
      $('scopeWrap').classList.toggle('hide', !show);
      if (show) $('scopeHint').textContent = scope === 'forward'
        ? 'Earlier months keep the old numbers. Use this for a raise or a rate change.'
        : 'Rewrites every month, past included. Use this to fix a mistake.';
    }
    if ($('scopeSeg')) {
      $('scopeSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
        scope = b.dataset.scope;
        $('scopeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
        syncScope();
      });
    }
    $('f-amt').addEventListener('input', syncScope);
    $('f-anch').addEventListener('change', syncScope);
    if ($('f-anch2')) $('f-anch2').addEventListener('change', syncScope);
    syncScope();

    $('f-cancel').onclick = closeSheet;
    $('f-save').onclick = async () => {
      const cad = getCad(), own = getOwn();
      const row = {
        household_id: state.household,
        name: $('f-name').value.trim() || (goal ? 'Set aside' : 'Untitled'),
        amount: Number($('f-amt').value) || 0,
        type: goal ? 'expense' : type,
        kind: goal ? 'bill' : (type === 'income' ? 'bill' : kind),
        cadence: cad,
        anchor_date: $('f-anch').value || null,
        anchor_date2: cad === 'semimonthly' ? ($('f-anch2').value || null) : null,
        category: goal ? 'Savings' : normCat(getCat()),
        owner_id: (own && own !== '__null') ? own : null,
        goal_id: gid
      };
      $('f-err').textContent = 'Saving…';

      if (item && isCurrent(item) && scope === 'forward' && material()) {
        const from = new Date(state.y, state.m, 1);
        const prevEnd = new Date(state.y, state.m, 0);
        if (prevEnd < pd(item.effective_from || '2000-01-01')) {
          const r = await sb.from('line_items').update(row).eq('id', item.id);
          if (r.error) { $('f-err').textContent = r.error.message; return; }
          closeSheet(); refresh(); return;
        }
        const close = await sb.from('line_items').update({ effective_to: iso(prevEnd) }).eq('id', item.id);
        if (close.error) { $('f-err').textContent = close.error.message; return; }
        row.series_id = item.series_id || item.id;
        row.effective_from = iso(from);
        row.effective_to = null;
        const ins = await sb.from('line_items').insert(row);
        if (ins.error) {
          await sb.from('line_items').update({ effective_to: null }).eq('id', item.id);
          $('f-err').textContent = ins.error.message; return;
        }
        closeSheet(); refresh(); return;
      }

      let res;
      if (item) {
        if (scope === 'all' && item.series_id) res = await sb.from('line_items').update(row).eq('series_id', item.series_id);
        else res = await sb.from('line_items').update(row).eq('id', item.id);
      } else {
        let from = new Date(state.y, state.m, 1);
        if (row.anchor_date) {
          const a = pd(row.anchor_date), aStart = new Date(a.getFullYear(), a.getMonth(), 1);
          if (aStart < from) from = aStart;
        }
        row.effective_from = iso(from);
        res = await sb.from('line_items').insert(row);
      }
      if (res.error) { $('f-err').textContent = res.error.message; return; }
      closeSheet(); refresh();
    };
    if (item) $('f-del').onclick = async () => {
      const sid = item.series_id;
      if (sid) await sb.from('line_items').update({ is_active:false }).eq('series_id', sid);
      else await sb.from('line_items').update({ is_active:false }).eq('id', item.id);
      closeSheet(); refresh();
    };
    if (!item) setTimeout(() => $('f-amt').focus(), 80);
  });
}

    (tx ? '<button class="btn-del" id="t-del">Delete</button>' : ''),
  function () {
    const getCat = goal ? (() => 'Savings') : chipGroup($('tCatChips'), catList(), t.category||null, null);
    const getOwn = state.members.length > 1
      ? chipGroup($('tOwnChips'), ownerOptions(), (tx ? (t.owner_id||'__null') : state.me), null, false)
      : (() => null);
    if (!goal) {
      $('tMoreBtn').onclick = () => { $('tMore').classList.remove('hide'); $('tMoreBtn').classList.add('hide'); };
      if (tx) { $('tMore').classList.remove('hide'); $('tMoreBtn').classList.add('hide'); }
    }
    $('t-cancel').onclick = closeSheet;
    $('t-save').onclick = async () => {
      const u = await sb.auth.getUser(), own = getOwn();
      const row = {
        household_id: state.household,
        amount: Number($('t-amt').value) || 0,
        category: goal ? 'Savings' : normCat(getCat()),
        description: $('t-desc').value.trim() || null,
        occurred_on: $('t-date').value || iso(new Date()),
        entered_by: u.data.user.id,
        owner_id: (own && own !== '__null') ? own : null,
        goal_id: goal ? goal.id : null
      };
      $('t-err').textContent = 'Saving…';
      const res = tx ? await sb.from('transactions').update(row).eq('id', tx.id)
                     : await sb.from('transactions').insert(row);
      if (res.error) { $('t-err').textContent = res.error.message; return; }
      closeSheet(); refresh();
    };
    if (tx) $('t-del').onclick = async () => {
      await sb.from('transactions').delete().eq('id', tx.id);
      closeSheet(); refresh();
    };
    if (!tx) setTimeout(() => $('t-amt').focus(), 80);
  });
}

/* ================= goal ================= */
function goalSheet(goal) {
  const g = goal || { name:'', target_amount:'', target_date:'' };
  openSheet(
    '<h2>'+(goal ? 'Edit goal' : 'New goal')+'</h2>'+
    '<p class="sub">Money you put here leaves the month and waits until you spend it.</p>'+
    '<label for="g-name">What are you saving for</label>'+
    '<input id="g-name" class="txt" value="'+esc(g.name)+'" placeholder="Disney trip, car insurance, new GPU">'+
    '<label for="g-target">Target amount (optional)</label>'+
    '<input id="g-target" class="txt num" type="number" inputmode="decimal" step="0.01" value="'+(g.target_amount||'')+'" placeholder="4000">'+
    '<label for="g-date">Need it by (optional)</label>'+
    '<input id="g-date" type="date" value="'+(g.target_date||'')+'">'+
    '<p class="hint">Give it both and the app works out what to put away each month.</p>'+
    '<p class="msg" id="g-err"></p>'+
    '<div class="sheet-actions"><button class="btn-cancel" id="g-cancel">Cancel</button>'+
    '<button class="btn-primary" id="g-save">Save</button></div>'+
    (goal ? '<button class="btn-del" id="g-del">Delete this goal</button>' : ''),
  function () {
    $('g-cancel').onclick = closeSheet;
    $('g-save').onclick = async () => {
      const row = {
        household_id: state.household,
        name: $('g-name').value.trim() || 'Savings',
        target_amount: $('g-target').value ? Number($('g-target').value) : null,
        target_date: $('g-date').value || null
      };
      $('g-err').textContent = 'Saving…';
      const res = goal ? await sb.from('goals').update(row).eq('id', goal.id)
                       : await sb.from('goals').insert(row);
      if (res.error) { $('g-err').textContent = res.error.message; return; }
      closeSheet(); refresh();
    };
    if (goal) $('g-del').onclick = async () => {
      await sb.from('goals').update({ is_active:false }).eq('id', goal.id);
      closeSheet(); refresh();
    };
    if (!goal) setTimeout(() => $('g-name').focus(), 80);
  });
}

/* ================= settings ================= */
function settingsSheet() {
  const h = state.home || {};
  const me = state.members.find(m => m.user_id === state.me) || {};
  const jars = state.goals.reduce((s,g) => s + goalSaved(g), 0);
  openSheet(
    '<h2>Settings</h2>'+
    '<p class="sub">The balance is what the projection counts forward from.</p>'+
    '<label for="s-bal">What is actually in the account</label>'+
    '<div class="amtwrap"><span>$</span><input id="s-bal" class="big" type="number" inputmode="decimal" '+
      'step="0.01" value="'+(h.opening_balance!=null?h.opening_balance:'')+'" placeholder="0" size="5"></div>'+
    '<label for="s-date">As of</label>'+
    '<input id="s-date" type="date" value="'+(h.opening_date||iso(new Date()))+'">'+
    '<p class="hint">Check your bank, put the number in, set the date. Everything projects forward from here.</p>'+
    (jars ? '<p class="hint">Set aside in jars: <b style="color:var(--gold)">'+money(jars)+'</b>. '+
      'The projection assumes that money has left the account.</p>' : '')+
    '<label for="s-name">Your name in this household</label>'+
    '<input id="s-name" class="txt" value="'+esc(me.display_name||'')+'" placeholder="Jared">'+
    '<p class="msg" id="s-err"></p>'+
    '<div class="sheet-actions"><button class="btn-cancel" id="s-cancel">Close</button>'+
    '<button class="btn-primary" id="s-save">Save</button></div>'+
    '<button class="btn-del" id="s-out">Sign out</button>',
  function () {
    $('s-cancel').onclick = closeSheet;
    $('s-out').onclick = () => { closeSheet(); sb.auth.signOut(); };
    $('s-save').onclick = async () => {
      $('s-err').textContent = 'Saving…';
      const a = await sb.from('households').update({
        opening_balance: Number($('s-bal').value) || 0,
        opening_date: $('s-date').value || null,
        checked_at: new Date().toISOString()
      }).eq('id', state.household);
      if (a.error) { $('s-err').textContent = a.error.message; return; }
      const nm = $('s-name').value.trim();
      if (nm && nm !== me.display_name) {
        const b = await sb.from('household_members').update({ display_name: nm })
          .eq('household_id', state.household).eq('user_id', state.me);
        if (b.error) { $('s-err').textContent = b.error.message; return; }
      }
      closeSheet();
      const h2 = await sb.from('households').select('*').eq('id', state.household).limit(1);
      state.home = (h2.data && h2.data[0]) || null;
      const m2 = await sb.from('household_members').select('*');
      state.members = m2.data || state.members;
      renderWhoBar(); refresh();
    };
    setTimeout(() => $('s-bal').focus(), 80);
  });
}

$('settingsBtn').onclick = settingsSheet;
$('addItem').onclick = () => itemSheet(null);
$('addTx').onclick   = () => txSheet(null);
$('addGoal').onclick = () => goalSheet(null);
document.addEventListener('click', e => {
  const c = e.target.closest('[data-contrib]');
  if (c) return itemSheet(null, c.dataset.contrib);
  const s = e.target.closest('[data-spend]');
  if (s) return txSheet(null, s.dataset.spend);
  const g = e.target.closest('[data-goal]');
  if (g) return goalSheet(state.goals.find(x => x.id === g.dataset.goal));
  const i = e.target.closest('[data-item]');
  if (i) return itemSheet(state.items.find(x => x.id === i.dataset.item));
  const t = e.target.closest('[data-tx]');
  if (t) return txSheet(state.tx.find(x => x.id === t.dataset.tx));
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(function(){}));
}
</script>
</body>
</html>
