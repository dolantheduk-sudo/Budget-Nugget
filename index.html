<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110E">
<title>Budget Nugget</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#14110E; --surface:#1D1915; --surface2:#262019; --line:#332B21;
    --gold:#E8B44A; --gold-hi:#FAE7AA; --gold-lo:#B8862F;
    --cream:#F2EADC; --muted:#9A8C79; --red:#E0705A; --green:#7FBE92;
    --display:'Fraunces',Georgia,serif;
    --sans:'Space Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--void)}
  body{color:var(--cream);font-family:var(--sans);font-size:16px;line-height:1.45;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:16px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .hide{display:none !important}
  ::selection{background:var(--gold);color:var(--void)}

  header{position:sticky;top:0;z-index:20;background:var(--void);
    padding:calc(10px + env(safe-area-inset-top)) 20px 0;border-bottom:1px solid var(--line)}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .wordmark{display:flex;align-items:center;gap:9px}
  .wordmark b{font-family:var(--display);font-weight:600;font-size:16.5px;color:var(--cream)}
  .signout{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:7px 0 7px 12px}
  .whobar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
  .whobar::-webkit-scrollbar{display:none}
  .who{padding:6px 13px;border-radius:100px;background:var(--surface2);border:1px solid var(--line);
    color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
  .who.on{background:var(--gold);border-color:var(--gold);color:#3A2609}
  .monthnav{display:flex;align-items:center;gap:4px;margin-bottom:12px}
  .monthnav button{width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:16px;
    line-height:1;display:grid;place-items:center;border:1px solid var(--line)}
  .monthnav button:active{background:var(--surface2);color:var(--gold)}
  .monthnav span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
    color:var(--muted);margin-left:6px}
  .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .total{font-size:46px;font-weight:700;letter-spacing:-.035em;line-height:1.05;margin-top:3px;
    background:linear-gradient(100deg,var(--gold-lo) 0%,var(--gold) 24%,var(--gold-hi) 42%,var(--gold) 60%,var(--gold-lo) 100%);
    background-size:280% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:sheen 7s ease-in-out infinite}
  .total.neg{background:none;-webkit-text-fill-color:var(--red);color:var(--red);animation:none}
  @keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  @media (prefers-reduced-motion:reduce){.total{animation:none}}
  .subtotal{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .subtotal b{color:var(--cream);font-weight:500}
  .flag{display:inline-flex;align-items:center;margin-top:11px;padding:5px 11px;border-radius:100px;
    background:rgba(232,180,74,.13);border:1px solid rgba(232,180,74,.35);color:var(--gold-hi);
    font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .hpad{height:18px}

  main{max-width:640px;margin:0 auto}
  .sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:26px 20px 10px;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}
  .sec-head .num{color:var(--cream);letter-spacing:.02em;font-size:12.5px}
  .rows{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:15px 20px;
    border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row:active{background:var(--surface2)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;opacity:.9}
  .dot.out{background:var(--muted);opacity:.5}
  .dot.paid{background:var(--green);opacity:.9}
  .row-main{flex:1;min-width:0}
  .row-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .row-meta .paidtag{color:var(--green)}
  .row-meta .shared{color:var(--gold);opacity:.85}
  .row-amt{text-align:right;white-space:nowrap;font-weight:600;letter-spacing:-.01em}
  .row-amt.in{color:var(--gold)}
  .row-amt small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
  .row-amt small.x3{color:var(--gold-hi)}
  .row.skip{opacity:.4}

  .env{display:block;width:100%;text-align:left;padding:15px 20px;border-bottom:1px solid var(--line)}
  .env:last-child{border-bottom:none}
  .env:active{background:var(--surface2)}
  .env-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .env-name{font-weight:500}
  .env-fig{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .env-fig b{color:var(--cream);font-weight:600}
  .track{height:5px;border-radius:3px;background:var(--surface2);margin-top:10px;overflow:hidden}
  .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold-lo),var(--gold));
    transition:width .4s ease}
  .fill.over{background:linear-gradient(90deg,#7A3226,var(--red))}
  .env-note{font-size:11.5px;color:var(--muted);margin-top:7px}
  .env-note.over{color:var(--red)}

  .empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13.5px}
  .empty strong{display:block;color:var(--cream);font-weight:600;margin-bottom:5px;font-size:15px;
    font-family:var(--display)}

  .outlook{padding:6px 20px 28px}
  .bars{display:flex;align-items:flex-end;gap:7px;height:104px}
  .bwrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
  .b{width:100%;min-height:3px;border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));transition:height .35s cubic-bezier(.2,.8,.3,1)}
  .b.neg{background:linear-gradient(180deg,var(--red),#7A3226)}
  .b.sel{box-shadow:0 0 0 1.5px var(--cream)}
  .bval{font-size:9.5px;text-align:center;margin-bottom:4px;color:var(--muted);font-variant-numeric:tabular-nums}
  .blabels{display:flex;gap:7px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .blabels div{flex:1;text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .blabels div.fat{color:var(--gold);font-weight:700}

  /* ---------- goal card with jar ---------- */
  .goal{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    margin:0 20px 16px;padding:18px;display:flex;gap:16px;align-items:flex-start}
  .jarwrap{flex:0 0 106px}
  .jar{display:block;width:106px;height:150px}
  .goal-body{flex:1;min-width:0;padding-top:2px}
  .goal-name{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em;
    line-height:1.15;word-break:break-word}
  .goal-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
  .goal-saved{margin-top:12px}
  .goal-saved b{font-size:25px;font-weight:700;color:var(--gold);letter-spacing:-.025em}
  .goal-saved small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  .pill{display:inline-block;margin-top:11px;padding:3px 9px;border-radius:100px;font-size:10.5px;
    font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .pill.ok{background:rgba(127,190,146,.15);color:var(--green);border:1px solid rgba(127,190,146,.35)}
  .pill.behind{background:rgba(224,112,90,.13);color:var(--red);border:1px solid rgba(224,112,90,.35)}
  .pill.none{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
  .pace{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
  .goal-acts{display:flex;gap:8px;margin:0 20px 18px}
  .goal-acts button{flex:1;padding:11px;border-radius:10px;background:var(--surface2);
    border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--cream)}
  .goal-acts button:active{border-color:var(--gold)}
  .goalblock{margin-bottom:6px}

  .add{display:flex;align-items:center;justify-content:center;gap:9px;width:calc(100% - 40px);
    margin:20px;padding:16px;border-radius:12px;
    background:linear-gradient(160deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
    color:#3A2609;font-weight:700;box-shadow:0 6px 20px -8px rgba(232,180,74,.55)}
  .add:active{transform:translateY(1px)}

  nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;
    background:rgba(20,17,14,.94);backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:14px 4px 13px;font-size:10.5px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);position:relative}
  nav button.on{color:var(--gold)}
  nav button.on::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:26px;height:2px;background:var(--gold);border-radius:0 0 2px 2px}

  .scrim{position:fixed;inset:0;background:rgba(8,6,4,.72);z-index:40;display:flex;align-items:flex-end;
    animation:fade .18s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--surface);width:100%;max-width:640px;margin:0 auto;
    padding:8px 20px calc(24px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;
    border-top:1px solid var(--line);max-height:93vh;overflow-y:auto;
    animation:up .26s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(24px)}to{transform:none}}
  @media (prefers-reduced-motion:reduce){.sheet,.scrim{animation:none}.fill,.b,.nugfill{transition:none}}
  .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sheet h2{margin:0 0 4px;font-family:var(--display);font-weight:600;font-size:19px}
  .sheet .sub{font-size:12.5px;color:var(--muted);margin:0 0 6px}

  .amtwrap{display:flex;align-items:center;justify-content:center;gap:2px;margin:14px 0 4px}
  .amtwrap span{font-size:26px;font-weight:500;color:var(--muted)}
  input.big{width:auto;max-width:100%;background:none;border:none;padding:6px 0;font-size:52px;
    font-weight:700;letter-spacing:-.04em;text-align:center;color:var(--gold);font-variant-numeric:tabular-nums}
  input.big:focus{outline:none}
  input.big::placeholder{color:var(--line)}

  label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:20px 0 8px}
  input.txt,select,input[type=date]{width:100%;padding:13px 14px;background:var(--surface2);
    border:1px solid var(--line);border-radius:11px;color:var(--cream)}
  input.txt:focus,select:focus,input[type=date]:focus{outline:none;border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(232,180,74,.12)}
  input.txt::placeholder{color:#5E5245}
  .hint{font-size:11.5px;color:var(--muted);margin:8px 0 0;text-transform:none;letter-spacing:0;font-weight:400}
  .twodates{display:flex;gap:10px}
  .twodates>div{flex:1}
  .twodates label{margin-top:0}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{padding:9px 14px;border-radius:100px;background:var(--surface2);border:1px solid var(--line);
    color:var(--muted);font-size:13.5px;font-weight:500}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#3A2609;font-weight:600}
  .chip.ghost{border-style:dashed}

  .seg{display:flex;gap:7px}
  .seg button{flex:1;padding:13px;border-radius:11px;background:var(--surface2);
    border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:600}
  .seg button.on{background:rgba(232,180,74,.16);border-color:var(--gold);color:var(--gold-hi)}
  .seg.plain button.on{background:var(--surface2);border-color:var(--cream);color:var(--cream)}

  .more{margin-top:18px;font-size:12.5px;color:var(--muted);text-align:center;padding:8px}
  .sheet-actions{display:flex;gap:10px;margin-top:22px}
  .sheet-actions button{flex:1;padding:15px;font-weight:700;border-radius:12px}
  .btn-primary{background:linear-gradient(160deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));color:#3A2609}
  .btn-cancel{flex:0 0 96px !important;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
  .btn-del{margin-top:14px;width:100%;padding:13px;color:var(--red);font-size:13px;font-weight:600}

  #auth,#onboard{max-width:400px;margin:0 auto;padding:13vh 26px 26px;text-align:center}
  #onboard{padding-top:11vh}
  #auth .nug,#onboard .nug{margin:0 auto 20px;display:block}
  .brand{font-family:var(--display);font-weight:600;font-size:33px;letter-spacing:-.02em;line-height:1.1}
  .brand-sub{color:var(--muted);font-size:14.5px;margin:8px 0 30px}
  #auth label,#onboard label{text-align:left}
  .msg{margin-top:15px;font-size:13px;color:var(--red);min-height:19px}
  .loading{padding:70px 20px;text-align:center;color:var(--muted);font-size:13.5px}
  .ob-big{display:block;width:100%;padding:16px;border-radius:12px;font-weight:700;margin-bottom:11px}
  .ob-big.btn-cancel{flex:none !important}
  input.code{text-align:center;font-size:26px;font-weight:700;letter-spacing:.28em;
    text-transform:uppercase;padding:16px 10px}
  .codebox{background:var(--surface2);border:1px dashed var(--gold);border-radius:12px;padding:20px;
    font-size:30px;font-weight:700;letter-spacing:.3em;color:var(--gold);text-align:center;text-indent:.3em}
  .invitefoot{padding:0 20px 34px;text-align:center;color:var(--muted);font-size:12px}
  .invitefoot b{color:var(--gold);letter-spacing:.22em;font-weight:700;margin-left:5px}
</style>
</head>
<body>

<section id="auth" class="hide">
  <svg class="nug" width="88" height="88" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="ga" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#FAE7AA"/><stop offset=".55" stop-color="#E8B44A"/><stop offset="1" stop-color="#96681E"/>
    </linearGradient></defs>
    <polygon fill="url(#ga)" points="32.0,8.7 43.6,14.8 56.8,19.9 56.3,32.5 55.9,44.6 43.1,49.4 32.0,55.8 17.4,54.7 11.4,43.0 3.9,32.5 12.4,22.5 19.0,12.7"/>
    <polygon fill="#FFF6DC" opacity=".34" points="32.0,8.7 19.0,12.7 12.4,22.5 32,32.5"/>
    <polygon fill="#000" opacity=".17" points="55.9,44.6 43.1,49.4 32.0,55.8 32,32.5"/>
    <text x="32" y="39.5" text-anchor="middle" font-size="19" font-weight="700" fill="#3A2609" font-family="Space Grotesk,sans-serif">BN</text>
  </svg>
  <div class="brand">Budget Nugget</div>
  <p class="brand-sub">Plan the month together.</p>
  <label for="email">Email</label>
  <input id="email" class="txt" type="email" autocomplete="email" inputmode="email">
  <label for="pw">Password</label>
  <input id="pw" class="txt" type="password" autocomplete="current-password">
  <div class="sheet-actions"><button class="btn-primary" id="signin">Sign in</button></div>
  <p class="msg" id="authmsg"></p>
</section>

<div id="boot" class="loading">Loading…</div>

<section id="onboard" class="hide">
  <svg class="nug" width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="gc" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#FAE7AA"/><stop offset=".55" stop-color="#E8B44A"/><stop offset="1" stop-color="#96681E"/>
    </linearGradient></defs>
    <polygon fill="url(#gc)" points="32.0,8.7 43.6,14.8 56.8,19.9 56.3,32.5 55.9,44.6 43.1,49.4 32.0,55.8 17.4,54.7 11.4,43.0 3.9,32.5 12.4,22.5 19.0,12.7"/>
    <polygon fill="#FFF6DC" opacity=".34" points="32.0,8.7 19.0,12.7 12.4,22.5 32,32.5"/>
  </svg>
  <div class="brand">One more thing</div>
  <p class="brand-sub">A household is the shared pot you both budget from.</p>
  <div id="ob-choose">
    <button class="btn-primary ob-big" id="ob-showCreate">Start a new household</button>
    <button class="btn-cancel ob-big" id="ob-showJoin">I have an invite code</button>
  </div>
  <div id="ob-create" class="hide">
    <label for="ob-name">Call it something</label>
    <input id="ob-name" class="txt" value="Home">
    <div class="sheet-actions"><button class="btn-cancel" id="ob-back1">Back</button>
      <button class="btn-primary" id="ob-create-go">Create</button></div>
  </div>
  <div id="ob-join" class="hide">
    <label for="ob-code">Invite code</label>
    <input id="ob-code" class="txt code" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="ABC123">
    <div class="sheet-actions"><button class="btn-cancel" id="ob-back2">Back</button>
      <button class="btn-primary" id="ob-join-go">Join</button></div>
  </div>
  <div id="ob-done" class="hide">
    <label>Your invite code</label>
    <div class="codebox" id="ob-madecode">------</div>
    <p class="hint" style="text-align:center">Send this to whoever is budgeting with you.</p>
    <div class="sheet-actions"><button class="btn-primary" id="ob-finish">Done</button></div>
  </div>
  <p class="msg" id="ob-err"></p>
  <button class="signout" id="ob-signout" style="margin-top:14px;padding:10px">Sign out</button>
</section>

<div id="app" class="hide">
  <header>
    <div class="topbar">
      <div class="wordmark">
        <svg class="nug" width="26" height="26" viewBox="0 0 64 64" aria-hidden="true">
          <defs><linearGradient id="gb" x1="0" y1="0" x2=".35" y2="1">
            <stop offset="0" stop-color="#FAE7AA"/><stop offset=".55" stop-color="#E8B44A"/><stop offset="1" stop-color="#96681E"/>
          </linearGradient></defs>
          <polygon fill="url(#gb)" points="32.0,8.7 43.6,14.8 56.8,19.9 56.3,32.5 55.9,44.6 43.1,49.4 32.0,55.8 17.4,54.7 11.4,43.0 3.9,32.5 12.4,22.5 19.0,12.7"/>
          <polygon fill="#FFF6DC" opacity=".34" points="32.0,8.7 19.0,12.7 12.4,22.5 32,32.5"/>
        </svg>
        <b>Budget Nugget</b>
      </div>
      <button class="signout" id="signout">Sign out</button>
    </div>
    <div class="whobar hide" id="whobar"></div>
    <div class="monthnav">
      <button id="prevM" aria-label="Previous month">&lsaquo;</button>
      <button id="nextM" aria-label="Next month">&rsaquo;</button>
      <span id="mLabel">&mdash;</span>
    </div>
    <div class="eyebrow" id="totalLabel">Left over</div>
    <div class="total num" id="totalNum">$0</div>
    <div class="subtotal" id="totalSub"></div>
    <div id="flagWrap"></div>
    <div class="hpad"></div>
  </header>

  <main>
    <section id="v-plan">
      <div class="sec-head"><span>Money in</span><span id="inSum" class="num"></span></div>
      <div class="rows" id="incomeRows"></div>
      <div class="sec-head"><span>Bills</span><span id="billSum" class="num"></span></div>
      <div class="rows" id="billRows"></div>
      <div class="sec-head"><span>Envelopes</span><span id="envSum" class="num"></span></div>
      <div class="rows" id="envRows"></div>
      <div class="sec-head" id="putHead"><span>Putting away</span><span id="goalSum" class="num"></span></div>
      <div class="rows" id="goalContribRows"></div>
      <button class="add" id="addItem">Add a line</button>
      <div class="sec-head"><span>Next six months</span></div>
      <div class="outlook">
        <div class="bars" id="bars"></div>
        <div class="blabels" id="blabels"></div>
      </div>
      <div class="invitefoot" id="inviteFoot"></div>
    </section>

    <section id="v-log" class="hide">

/* ===== exact dates for every cadence ===== */
function occDates(item, y, m) {
  const c = item.cadence, first = new Date(y,m,1), last = new Date(y,m+1,0), out = [];
  const dayIn = d => new Date(y, m, Math.min(Math.max(1,d), last.getDate()));
  if (c === 'semimonthly') {
    const d1 = item.anchor_date  ? pd(item.anchor_date).getDate()  : 1;
    const d2 = item.anchor_date2 ? pd(item.anchor_date2).getDate() : 15;
    return [dayIn(d1), dayIn(d2)].sort((a,b) => a-b);
  }
  if (c === 'monthly') return [dayIn(item.anchor_date ? pd(item.anchor_date).getDate() : 1)];
  if (!item.anchor_date) return null;
  const a = pd(item.anchor_date);
  if (c === 'once') return (a >= first && a <= last) ? [a] : [];
  if (c === 'weekly' || c === 'biweekly') {
    const step = c === 'weekly' ? 7 : 14, d = new Date(a);
    while (d > first) d.setDate(d.getDate() - step);
    while (d < first) d.setDate(d.getDate() + step);
    while (d <= last) { out.push(new Date(d)); d.setDate(d.getDate() + step); }
    return out;
  }
  if (c === 'quarterly') {
    const diff = (y-a.getFullYear())*12 + (m-a.getMonth());
    return (diff >= 0 && diff % 3 === 0) ? [dayIn(a.getDate())] : [];
  }
  if (c === 'annual') return (m === a.getMonth() && y >= a.getFullYear()) ? [dayIn(a.getDate())] : [];
  return null;
}
function occurrences(item, y, m) {
  const d = occDates(item, y, m);
  return d === null ? AVG[item.cadence] : d.length;
}
function occurredSoFar(item, y, m) {
  const d = occDates(item, y, m);
  if (d === null) return AVG[item.cadence];
  const t = today();
  return d.filter(x => x <= t).length;
}
function occurrencesToDate(item) {
  const start = item.anchor_date ? pd(item.anchor_date)
              : (item.created_at ? pd(item.created_at) : today());
  const t = today();
  if (start > t) return 0;
  let n = 0, y = start.getFullYear(), m = start.getMonth(), guard = 0;
  const ey = t.getFullYear(), em = t.getMonth();
  while ((y < ey || (y === ey && m <= em)) && guard++ < 900) {
    const ds = occDates(item, y, m);
    if (ds === null) n += AVG[item.cadence];
    else n += ds.filter(d => d >= start && d <= t).length;
    m++; if (m > 11) { m = 0; y++; }
  }
  return n;
}

/* ===== whose money is this? ===== */
const memberCount = () => Math.max(1, state.members.length);
function share(item) {
  if (state.who === 'all') return 1;
  if (item.owner_id === state.who) return 1;
  if (!item.owner_id) return 1 / memberCount();
  return 0;
}
function txShare(t) {
  if (state.who === 'all') return 1;
  const o = t.owner_id || t.entered_by;
  if (o === state.who) return 1;
  if (!o) return 1 / memberCount();
  return 0;
}
const amountIn = (i,y,m) => Number(i.amount) * occurrences(i,y,m) * share(i);

function totals(y, m) {
  let inc = 0, bill = 0, env = 0, goal = 0;
  for (const it of state.items) {
    const v = amountIn(it, y, m);
    if (it.type === 'income') inc += v;
    else if (it.goal_id) goal += v;
    else if (it.kind === 'envelope') env += v;
    else bill += v;
  }
  return { inc:inc, bill:bill, env:env, goal:goal, out:bill+env+goal, left:inc-bill-env-goal };
}
function extraPaychecks(y, m) {
  return state.items.some(i => i.type === 'income' && i.anchor_date && share(i) > 0 &&
    (i.cadence === 'biweekly' || i.cadence === 'weekly') &&
    occurrences(i, y, m) > (i.cadence === 'biweekly' ? 2 : 4));
}
function goalSaved(g) {

    .forEach(t => { acc -= Number(t.amount) * txShare(t); });
  return acc;
}

      .gte('occurred_on', from).lte('occurred_on', to).order('occurred_on', { ascending:false }),
    sb.from('goals').select('*').eq('is_active', true).order('created_at'),
    sb.from('transactions').select('*').not('goal_id','is',null).order('occurred_on', { ascending:false })
  ]);

  state.items  = res[0].data || [];
  state.tx     = res[1].data || [];
  state.goals  = res[2].data || [];
  state.goalTx = res[3].data || [];

/* ===== render ===== */
function render() {
  const y = state.y, m = state.m, t = totals(y, m);
  const isThisMonth = (y === now.getFullYear() && m === now.getMonth());
  const personal = state.who !== 'all';

  $('mLabel').textContent = mLabel(y, m);
  $('totalNum').textContent = money(t.left);
  $('totalNum').className = 'total num' + (t.left < 0 ? ' neg' : '');
  $('totalLabel').textContent = (t.left < 0 ? 'Short this month' : 'Left over this month') +

  $('totalSub').innerHTML =
    '<span>In <b class="num">'+money(t.inc)+'</b></span>'+
    '<span>Out <b class="num">'+money(t.out)+'</b></span>'+
    (t.goal ? '<span>Saved <b class="num">'+money(t.goal)+'</b></span>' : '');
  $('flagWrap').innerHTML = extraPaychecks(y,m) ? '<span class="flag">Three-paycheck month</span>' : '';

  const income = state.items.filter(i => i.type === 'income' && vis(i));
  const bills  = state.items.filter(i => i.type === 'expense' && !i.goal_id && i.kind !== 'envelope' && vis(i));

  $('inSum').textContent   = money(t.inc);

  envelopeRows('envRows', envs, y, m, isThisMonth);

  const out = [];
  for (let k = 0; k < 6; k++) {
    const d = new Date(y,m+k,1), yy = d.getFullYear(), mm = d.getMonth();
    out.push({ y:yy, m:mm, left:totals(yy,mm).left, fat:extraPaychecks(yy,mm) });

    '<div class="bwrap"><div class="bval">'+money(o.left)+'</div><div class="b'+(o.left<0?' neg':'')+

  const visTx = state.tx.filter(x => txShare(x) > 0);
  const spent = visTx.reduce((s,x) => s + Number(x.amount) * txShare(x), 0);
  $('logMonth').textContent = mLabel(y,m);
  $('logSum').textContent = money2(spent);
  $('txRows').innerHTML = visTx.length ? visTx.map(x => {
    const who = state.members.length > 1 ? ' &middot; ' + nameOf(x.owner_id || x.entered_by) : '';

    '<div class="row-name">'+esc(x.description || x.category)+'</div>'+
    '<div class="row-meta">'+esc(x.category)+' &middot; '+shortDate(x.occurred_on)+who+'</div></div>'+
    '<div class="row-amt">'+money2(Number(x.amount))+'</div></button>';
  }).join('')
    : '<div class="empty"><strong>Nothing logged yet</strong>Only envelope spending goes here. Bills take care of themselves.</div>';

  renderGoals();
}

function ownerTag(i) {
  if (state.members.length < 2) return '';
  if (!i.owner_id) return ' &middot; <span class="shared">shared</span>';
  return ' &middot; ' + esc(i.owner_id === state.me ? 'you' : nameOf(i.owner_id));
}

function plainRows(target, list, emptyTitle, emptyBody) {
  const y = state.y, m = state.m;
  if (!list.length) {
    $(target).innerHTML = emptyTitle ? '<div class="empty"><strong>'+emptyTitle+'</strong>'+emptyBody+'</div>' : '';
    return;
  }
  $(target).innerHTML = list.map(i => {
    const n = occurrences(i,y,m), whole = Number.isInteger(n), inc = i.type === 'income';
    const g = i.goal_id ? state.goals.find(x => x.id === i.goal_id) : null;
    const dates = occDates(i,y,m);
    let sub;
    if (n === 0) sub = 'not this month';
    else if (!whole) sub = 'averaged &mdash; set a date';
    else if (dates && dates.length && n <= 2)
      sub = dates.map(d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'})).join(', ');
    else sub = '&times;'+n+' &middot; '+money(Number(i.amount)*n);
    const fat = whole && ((i.cadence==='biweekly'&&n>2)||(i.cadence==='weekly'&&n>4));
    return '<button class="row'+(n===0?' skip':'')+'" data-item="'+i.id+'">'+
      '<span class="dot'+(inc?'':' out')+'"></span><div class="row-main">'+
      '<div class="row-name">'+esc(i.name)+'</div><div class="row-meta">'+
      esc(g ? g.name : i.category)+ownerTag(i)+'</div></div>'+
      '<div class="row-amt'+(inc?' in':'')+'">'+money2(Number(i.amount))+
      '<small class="'+(fat?'x3':'')+'">'+sub+'</small></div></button>';
  }).join('');
}

function billRows(target, list, y, m) {
  if (!list.length) {
    $(target).innerHTML = '<div class="empty"><strong>No bills yet</strong>Rent, insurance, subscriptions &mdash; the ones you do not decide each month.</div>';
    return;
  }
  const past = new Date(y,m,1) < new Date(now.getFullYear(), now.getMonth(), 1);
  $(target).innerHTML = list.map(i => {
    const dates = occDates(i,y,m), n = occurrences(i,y,m);
    const done = past ? n : occurredSoFar(i,y,m);
    let meta;
    if (n === 0) meta = 'not due this month';
    else if (done >= n) meta = '<span class="paidtag">&#10003; paid</span>';
    else if (dates && dates.length) {
      const next = dates.filter(d => d > today())[0];
      meta = next ? 'due ' + next.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : 'due';
      if (done > 0) meta = done+' of '+n+' paid &middot; '+meta;
    } else meta = 'scheduled';
    return '<button class="row'+(n===0?' skip':'')+'" data-item="'+i.id+'">'+
      '<span class="dot'+(n>0&&done>=n?' paid':' out')+'"></span><div class="row-main">'+
      '<div class="row-name">'+esc(i.name)+'</div>'+
      '<div class="row-meta">'+meta+ownerTag(i)+'</div></div>'+
      '<div class="row-amt">'+money2(Number(i.amount))+
      (n>1?'<small>&times;'+n+' &middot; '+money(Number(i.amount)*n)+'</small>':'')+'</div></button>';
  }).join('');
}

function envelopeRows(target, list, y, m, isThisMonth) {
  if (!list.length) {
    $(target).innerHTML = '<div class="empty"><strong>No envelopes yet</strong>Groceries, fun, dining out &mdash; the ones that vary.</div>';
    return;
  }
  const daysLeft = isThisMonth ? (new Date(y,m+1,0).getDate() - now.getDate()) : 0;
  $(target).innerHTML = list.map(i => {
    const planned = amountIn(i,y,m);
    const actual = state.tx.filter(t => t.category === i.category)
      .reduce((s,t) => s + Number(t.amount) * txShare(t), 0);
    const pct = planned > 0 ? Math.min(100, actual/planned*100) : (actual > 0 ? 100 : 0);
    const over = planned > 0 && actual > planned;
    let note;
    if (planned === 0) note = 'nothing budgeted';
    else if (over) note = money2(actual-planned)+' over';
    else note = money2(planned-actual)+' left'+(isThisMonth && daysLeft>0 ? ' &middot; '+daysLeft+' days to go' : '');
    return '<button class="env" data-item="'+i.id+'">'+
      '<div class="env-top"><span class="env-name">'+esc(i.name)+'</span>'+
      '<span class="env-fig"><b>'+money2(actual)+'</b> of '+money2(planned)+'</span></div>'+
      '<div class="track"><div class="fill'+(over?' over':'')+'" style="width:'+pct+'%"></div></div>'+
      '<div class="env-note'+(over?' over':'')+'">'+note+'</div></button>';
  }).join('');
}

/* ===== the jar ===== */
function jarSvg(pct, id) {
  const YTOP = 36, YBOT = 150;
  const line = YBOT - (YBOT - YTOP) * Math.max(0, Math.min(1, pct));
  const nugs = NUGS.filter(n => n[1] >= line - 3).map((n,k) => {
    const x = n[0], y = n[1], r = n[2], rot = n[3];
    const pts = [];
    const offs = [1,.82,1.06,.88,1.02,.86];
    for (let j = 0; j < 6; j++) {
      const a = (j/6)*Math.PI*2 + rot*Math.PI/180;
      pts.push((x + Math.cos(a)*r*offs[j]).toFixed(1) + ',' + (y + Math.sin(a)*r*offs[j]*.9).toFixed(1));
    }
    return '<polygon points="'+pts.join(' ')+'" fill="url(#ng'+id+')" stroke="#7A5416" stroke-width=".6"/>'+
           '<circle cx="'+(x-r*.28).toFixed(1)+'" cy="'+(y-r*.32).toFixed(1)+'" r="'+(r*.22).toFixed(1)+'" fill="#FFF3D0" opacity=".55"/>';
  }).join('');
  return '<svg class="jar" viewBox="0 0 120 170" aria-hidden="true">'+
    '<defs>'+
      '<linearGradient id="ng'+id+'" x1="0" y1="0" x2=".4" y2="1">'+
        '<stop offset="0" stop-color="#FAE7AA"/><stop offset=".5" stop-color="#E8B44A"/><stop offset="1" stop-color="#9C6C20"/></linearGradient>'+
      '<linearGradient id="gl'+id+'" x1="0" y1="0" x2="1" y2="0">'+
        '<stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>'+
        '<stop offset=".28" stop-color="#ffffff" stop-opacity=".04"/>'+
        '<stop offset=".72" stop-color="#ffffff" stop-opacity=".03"/>'+
        '<stop offset="1" stop-color="#ffffff" stop-opacity=".12"/></linearGradient>'+
      '<clipPath id="cp'+id+'"><path d="M16 40 Q16 32 24 30 L96 30 Q104 32 104 40 L104 142 Q104 154 92 154 L28 154 Q16 154 16 142 Z"/></clipPath>'+
    '</defs>'+
    '<rect x="30" y="12" width="60" height="9" rx="4" fill="#4A3A22"/>'+
    '<rect x="26" y="19" width="68" height="11" rx="4" fill="#5C4828"/>'+
    '<g clip-path="url(#cp'+id+')">'+
      '<rect x="14" y="28" width="92" height="128" fill="#241E17"/>'+ nugs +
    '</g>'+
    '<path d="M16 40 Q16 32 24 30 L96 30 Q104 32 104 40 L104 142 Q104 154 92 154 L28 154 Q16 154 16 142 Z" fill="url(#gl'+id+')" stroke="#6B5B44" stroke-width="2"/>'+
    '<rect x="24" y="44" width="6" height="86" rx="3" fill="#ffffff" opacity=".10"/>'+
    '</svg>';
}

function renderGoals() {
  const total = state.goals.reduce((s,g) => s + goalSaved(g), 0);
  $('goalsTotal').textContent = money(total);
  if (!state.goals.length) {
    $('goalCards').innerHTML = '<div class="empty"><strong>Nothing saved for yet</strong>'+
      'A trip, a new GPU, next year&rsquo;s insurance. Money you put here leaves the month and waits in the jar.</div>';
    return;
  }
  const t = today();
  $('goalCards').innerHTML = state.goals.map((g,idx) => {
    const saved = goalSaved(g), target = Number(g.target_amount) || 0, per = goalMonthly(g);
    const pct = target > 0 ? saved/target : (saved > 0 ? .35 : 0);
    let sub = '', pace = '', pill = '';
    if (target > 0 && g.target_date) {
      const td = pd(g.target_date);
      const months = Math.max(0, (td.getFullYear()-t.getFullYear())*12 + (td.getMonth()-t.getMonth()));
      const need = months > 0 ? (target-saved)/months : Math.max(0, target-saved);
      sub = 'by ' + td.toLocaleDateString('en-US',{month:'long',year:'numeric'});
      if (saved >= target) { pill = '<span class="pill ok">Funded</span>'; pace = 'Go book it.'; }
      else if (months === 0) { pill = '<span class="pill behind">Due now</span>'; pace = money(target-saved)+' still short.'; }
      else if (per >= need - 0.5) { pill = '<span class="pill ok">On pace</span>';
        pace = money(per)+'/mo covers the '+money(need)+'/mo you need.'; }
      else { pill = '<span class="pill behind">Behind</span>';
        pace = 'Needs '+money(need)+'/mo, putting away '+money(per)+'.'; }
    } else if (target > 0) {
      sub = 'no deadline';
      pill = saved >= target ? '<span class="pill ok">Funded</span>' : '<span class="pill none">No deadline</span>';
      pace = per > 0 ? money(per)+'/mo &middot; '+Math.ceil((target-saved)/per)+' months to go' : 'Add a contribution to start.';
    } else {
      sub = 'open-ended';
      pill = '<span class="pill none">No target</span>';
      pace = per > 0 ? 'Putting away '+money(per)+'/mo.' : 'Add a contribution to start.';
    }
    return '<div class="goalblock"><div class="goal">'+
      '<div class="jarwrap">'+jarSvg(pct, idx)+'</div>'+
      '<div class="goal-body"><div class="goal-name">'+esc(g.name)+'</div>'+
      '<div class="goal-sub">'+sub+'</div>'+
      '<div class="goal-saved"><b class="num">'+money(saved)+'</b>'+
      (target>0?'<small>of '+money(target)+'</small>':'<small>set aside</small>')+'</div>'+
      pill+'<div class="pace">'+pace+'</div></div></div>'+
      '<div class="goal-acts">'+
        '<button data-contrib="'+g.id+'">Put money in</button>'+
        '<button data-spend="'+g.id+'">Spend from it</button>'+
        '<button data-goal="'+g.id+'">Edit</button></div></div>';
  }).join('');
}

/* ===== nav ===== */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  state.view = b.dataset.view;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x===b));
  ['plan','log','goals'].forEach(v => $('v-'+v).classList.toggle('hide', v !== state.view));
  window.scrollTo(0,0);
});
$('prevM').onclick = () => { const d=new Date(state.y,state.m-1,1); state.y=d.getFullYear(); state.m=d.getMonth(); refresh(); };
$('nextM').onclick = () => { const d=new Date(state.y,state.m+1,1); state.y=d.getFullYear(); state.m=d.getMonth(); refresh(); };

/* ===== onboarding ===== */
const obPanels = ['ob-choose','ob-create','ob-join','ob-done'];
const obShow = id => obPanels.forEach(p => $(p).classList.toggle('hide', p !== id));
function showOnboarding(){ $('app').classList.add('hide'); $('onboard').classList.remove('hide');
  $('ob-err').textContent=''; obShow('ob-choose'); }
$('ob-showCreate').onclick = () => { obShow('ob-create'); $('ob-name').focus(); };
$('ob-showJoin').onclick   = () => { obShow('ob-join'); $('ob-code').focus(); };
$('ob-back1').onclick = () => { $('ob-err').textContent=''; obShow('ob-choose'); };
$('ob-back2').onclick = () => { $('ob-err').textContent=''; obShow('ob-choose'); };
$('ob-signout').onclick = () => sb.auth.signOut();
$('ob-create-go').onclick = async () => {
  $('ob-err').textContent = 'Creating…';

$('ob-finish').onclick = () => start();
async function loadInviteCode() {
  const r = await sb.rpc('my_invite_code');
  const el = $('inviteFoot');
  if (el) el.innerHTML = r.data ? 'Invite code<b>'+esc(r.data)+'</b>' : '';
}

/* ===== sheets ===== */
const closeSheet = () => { $('modal').innerHTML = ''; };
function openSheet(html, wire) {
  $('modal').innerHTML = '<div class="scrim"><div class="sheet"><div class="grab"></div>'+html+'</div></div>';
  $('modal').querySelector('.scrim').addEventListener('click', e => {
    if (e.target.classList.contains('scrim')) closeSheet();
  });
  wire();
}
function catList() {
  const freq = {};
  state.tx.forEach(t => freq[t.category] = (freq[t.category]||0)+1);
  state.items.forEach(i => { if (!i.goal_id) freq[i.category] = (freq[i.category]||0)+1; });
  const used = Object.keys(freq).sort((a,b) => freq[b]-freq[a]);
  return used.concat(DEFAULT_CATS.filter(c => used.indexOf(c) === -1));
}
function normCat(v) {
  const t = String(v||'').trim().replace(/\s+/g,' ');
  if (!t) return 'Other';
  const hit = catList().find(c => c.toLowerCase() === t.toLowerCase());
  return hit || (t.charAt(0).toUpperCase() + t.slice(1));
}
function chipGroup(host, options, selected, onPick, allowNew) {
  const draw = () => {
    host.innerHTML = options.map(o => {
      const v = Array.isArray(o)?o[0]:o, l = Array.isArray(o)?o[1]:o;
      return '<button type="button" class="chip'+(v===selected?' on':'')+'" data-v="'+esc(v)+'">'+esc(l)+'</button>';
    }).join('') + (allowNew === false ? '' : '<button type="button" class="chip ghost" data-new="1">+ Other</button>');
    host.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
      selected = b.dataset.v === '__null' ? null : b.dataset.v; draw(); if (onPick) onPick(selected);
    });
    const nb = host.querySelector('[data-new]');
    if (nb) nb.onclick = () => {
      host.innerHTML = '<input class="txt" placeholder="Type a category">';
      const inp = host.querySelector('input'); inp.focus();
      inp.onblur = inp.onchange = () => {
        const v = normCat(inp.value);
        if (inp.value.trim()) { if (options.indexOf(v) === -1) options.unshift(v); selected = v; }
        draw(); if (onPick) onPick(selected);
      };
    };
  };
  draw();
  return () => selected;
}
const ownerOptions = () => [['__null','Shared']].concat(
  state.members.map(m => [m.user_id, m.user_id === state.me ? 'Me' : m.display_name]));

/* ===== plan line ===== */
function itemSheet(item, presetGoalId) {
  const gid = item ? item.goal_id : (presetGoalId || null);
  const goal = gid ? state.goals.find(g => g.id === gid) : null;
  const it = item || { name:'', amount:'', type:'expense', kind:'bill', cadence:'monthly',
                       category:'', owner_id:null, anchor_date:iso(new Date()), anchor_date2:null, goal_id:gid };
  openSheet(
    '<h2>'+(item ? 'Edit line' : goal ? 'Put money into '+esc(goal.name) : 'New line')+'</h2>'+
    (goal ? '<p class="sub">Leaves the month, waits in the jar.</p>' : '')+
    '<div class="amtwrap"><span>$</span><input id="f-amt" class="big" type="number" inputmode="decimal" '+
      'step="0.01" value="'+it.amount+'" placeholder="0" size="5"></div>'+
    (goal ? '' :
      '<div class="seg plain" id="typeSeg" style="margin-top:10px">'+
      '<button type="button" data-type="expense" class="'+(it.type==='expense'?'on':'')+'">Money out</button>'+
      '<button type="button" data-type="income" class="'+(it.type==='income'?'on':'')+'">Money in</button></div>'+
      '<div id="kindWrap"><label>What kind</label><div class="seg" id="kindSeg">'+
      '<button type="button" data-kind="bill" class="'+(it.kind!=='envelope'?'on':'')+'">Bill</button>'+
      '<button type="button" data-kind="envelope" class="'+(it.kind==='envelope'?'on':'')+'">Envelope</button></div>'+
      '<p class="hint" id="kindHint"></p></div>')+
    '<label>How often</label><div class="chips" id="cadChips"></div>'+
    '<div id="anchorWrap"><div class="twodates">'+
      '<div><label for="f-anch" id="anchLabel">Date</label><input id="f-anch" type="date" value="'+(it.anchor_date||iso(new Date()))+'"></div>'+
      '<div id="anch2Wrap" class="hide"><label for="f-anch2">Second date</label>'+
      '<input id="f-anch2" type="date" value="'+(it.anchor_date2||'')+'"></div>'+
      '</div><p class="hint" id="anchHint"></p></div>'+
    '<label for="f-name">What is it</label>'+
    '<input id="f-name" class="txt" value="'+esc(it.name)+'" placeholder="'+(goal?'Monthly set-aside':'Rent, paycheck, groceries')+'">'+
    (goal ? '' : '<label>Category</label><div class="chips" id="catChips"></div>')+
    (state.members.length > 1 ? '<label>Whose</label><div class="chips" id="ownChips"></div>'+
      '<p class="hint">Shared lines split evenly when you switch to a personal view.</p>' : '')+
    '<p class="msg" id="f-err"></p>'+
    '<div class="sheet-actions"><button class="btn-cancel" id="f-cancel">Cancel</button>'+
    '<button class="btn-primary" id="f-save">Save</button></div>'+
    (item ? '<button class="btn-del" id="f-del">Delete this line</button>' : ''),
  function () {
    let type = it.type, kind = it.kind || 'bill';
    if (!goal) {
      const syncKind = () => {
        $('kindWrap').classList.toggle('hide', type === 'income');
        $('kindHint').textContent = kind === 'envelope'
          ? 'A spending budget. Log purchases against it.'
          : 'Fixed and predictable. Marks itself paid on its date.';
      };
      $('typeSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
        type = b.dataset.type;
        $('typeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
        syncKind();
      });
      $('kindSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
        kind = b.dataset.kind;
        $('kindSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x===b));
        syncKind();
      });
      syncKind();
    }
    const syncAnchor = c => {
      $('anch2Wrap').classList.toggle('hide', c !== 'semimonthly');
      $('anchLabel').textContent =
        c === 'once' ? 'When' : c === 'semimonthly' ? 'First date' :
        c === 'monthly' ? 'Day of the month' : 'A date it lands';
      $('anchHint').textContent =
        c === 'once' ? 'Counts in that month only.'
      : c === 'semimonthly' ? 'Two fixed days each month — the 1st and 15th, say.'
      : c === 'monthly' ? 'The day it comes out. Used to mark it paid.'
      : c === 'biweekly' ? 'Any real payday. Some months get three.'
      : c === 'weekly' ? 'Any date it hits. Some months get five.'
      : c === 'quarterly' ? 'The first time it is due.'
      : 'The month and day it is due.';
      if (c === 'semimonthly' && !$('f-anch2').value) {
        const d = new Date(); d.setDate(15); $('f-anch2').value = iso(d);
      }
    };
    const getCad = chipGroup($('cadChips'), CAD.slice(), it.cadence, syncAnchor);
    syncAnchor(it.cadence);
    const getCat = goal ? (() => null) : chipGroup($('catChips'), catList(), it.category||null, null);
    const getOwn = state.members.length > 1
      ? chipGroup($('ownChips'), ownerOptions(), it.owner_id || '__null', null, false)
      : (() => null);
    $('f-cancel').onclick = closeSheet;
    $('f-save').onclick = async () => {
      const cad = getCad(), own = getOwn();
      const row = {
        household_id: state.household,
        name: $('f-name').value.trim() || (goal ? 'Set aside' : 'Untitled'),
        amount: Number($('f-amt').value) || 0,
        type: goal ? 'expense' : type,
        kind: goal ? 'bill' : (type === 'income' ? 'bill' : kind),
        cadence: cad,
        anchor_date: $('f-anch').value || null,
        anchor_date2: cad === 'semimonthly' ? ($('f-anch2').value || null) : null,
        category: goal ? 'Savings' : normCat(getCat()),
        owner_id: (own && own !== '__null') ? own : null,
        goal_id: gid
      };
      $('f-err').textContent = 'Saving…';
      const res = item ? await sb.from('line_items').update(row).eq('id', item.id)
                       : await sb.from('line_items').insert(row);
      if (res.error) { $('f-err').textContent = res.error.message; return; }
      closeSheet(); refresh();
    };
    if (item) $('f-del').onclick = async () => {
      await sb.from('line_items').update({ is_active:false }).eq('id', item.id);
      closeSheet(); refresh();
    };
    if (!item) setTimeout(() => $('f-amt').focus(), 80);
  });
}

/* ===== purchase ===== */
function txSheet(tx, spendGoalId) {
  const goal = spendGoalId ? state.goals.find(g => g.id === spendGoalId)
             : (tx && tx.goal_id ? state.goals.find(g => g.id === tx.goal_id) : null);
  const t = tx || { amount:'', description:'', category:'', occurred_on:iso(new Date()), owner_id:null };
  openSheet(
    '<h2>'+(tx ? 'Edit' : goal ? 'Spend from '+esc(goal.name) : 'Log a purchase')+'</h2>'+
    (goal ? '<p class="sub">Comes out of the jar. Does not touch this month.</p>' : '')+
    '<div class="amtwrap"><span>$</span><input id="t-amt" class="big" type="number" inputmode="decimal" '+
      'step="0.01" value="'+t.amount+'" placeholder="0" size="5"></div>'+
    (goal ? '' : '<label>Category</label><div class="chips" id="tCatChips"></div>')+
    '<div id="tMore" class="'+(goal?'':'hide')+'">'+
      '<label for="t-desc">Note</label>'+
      '<input id="t-desc" class="txt" value="'+esc(t.description||'')+'" placeholder="'+(goal?'Park tickets':'Elden Ring, Wegmans')+'">'+
      '<label for="t-date">Date</label><input id="t-date" type="date" value="'+t.occurred_on+'">'+
      (state.members.length > 1 ? '<label>Whose</label><div class="chips" id="tOwnChips"></div>' : '')+
    '</div>'+
    (goal ? '' : '<div class="more" id="tMoreBtn">Note, date, or whose</div>')+
    '<p class="msg" id="t-err"></p>'+
    '<div class="sheet-actions"><button class="btn-cancel" id="t-cancel">Cancel</button>'+
    '<button class="btn-primary" id="t-save">Save</button></div>'+
    (tx ? '<button class="btn-del" id="t-del">Delete</button>' : ''),
  function () {
    const getCat = goal ? (() => 'Savings') : chipGroup($('tCatChips'), catList(), t.category||null, null);
    const getOwn = state.members.length > 1
      ? chipGroup($('tOwnChips'), ownerOptions(), (tx ? (t.owner_id||'__null') : state.me), null, false)
      : (() => null);
    if (!goal) {
      $('tMoreBtn').onclick = () => { $('tMore').classList.remove('hide'); $('tMoreBtn').classList.add('hide'); };
      if (tx) { $('tMore').classList.remove('hide'); $('tMoreBtn').classList.add('hide'); }
    }
    $('t-cancel').onclick = closeSheet;
    $('t-save').onclick = async () => {
      const u = await sb.auth.getUser(), own = getOwn();
      const row = {
        household_id: state.household,
        amount: Number($('t-amt').value) || 0,
        category: goal ? 'Savings' : normCat(getCat()),
        description: $('t-desc').value.trim() || null,
        occurred_on: $('t-date').value || iso(new Date()),
        entered_by: u.data.user.id,
        owner_id: (own && own !== '__null') ? own : null,
        goal_id: goal ? goal.id : null
      };
      $('t-err').textContent = 'Saving…';
      const res = tx ? await sb.from('transactions').update(row).eq('id', tx.id)
                     : await sb.from('transactions').insert(row);
      if (res.error) { $('t-err').textContent = res.error.message; return; }
      closeSheet(); refresh();
    };
    if (tx) $('t-del').onclick = async () => {
      await sb.from('transactions').delete().eq('id', tx.id);
      closeSheet(); refresh();
    };
    if (!tx) setTimeout(() => $('t-amt').focus(), 80);
  });
}

/* ===== goal ===== */
function goalSheet(goal) {
  const g = goal || { name:'', target_amount:'', target_date:'' };
  openSheet(
    '<h2>'+(goal ? 'Edit goal' : 'New goal')+'</h2>'+
    '<p class="sub">Money you put here leaves the month and waits until you spend it.</p>'+
    '<label for="g-name">What are you saving for</label>'+
    '<input id="g-name" class="txt" value="'+esc(g.name)+'" placeholder="Disney trip, car insurance, new GPU">'+
    '<label for="g-target">Target amount (optional)</label>'+
    '<input id="g-target" class="txt num" type="number" inputmode="decimal" step="0.01" value="'+(g.target_amount||'')+'" placeholder="4000">'+
    '<label for="g-date">Need it by (optional)</label>'+
    '<input id="g-date" type="date" value="'+(g.target_date||'')+'">'+
    '<p class="hint">Give it both and the app works out what to put away each month.</p>'+
    '<p class="msg" id="g-err"></p>'+
    '<div class="sheet-actions"><button class="btn-cancel" id="g-cancel">Cancel</button>'+
    '<button class="btn-primary" id="g-save">Save</button></div>'+
    (goal ? '<button class="btn-del" id="g-del">Delete this goal</button>' : ''),
  function () {
    $('g-cancel').onclick = closeSheet;
    $('g-save').onclick = async () => {
      const row = {
        household_id: state.household,
        name: $('g-name').value.trim() || 'Savings',
        target_amount: $('g-target').value ? Number($('g-target').value) : null,
        target_date: $('g-date').value || null
      };
      $('g-err').textContent = 'Saving…';
      const res = goal ? await sb.from('goals').update(row).eq('id', goal.id)
                       : await sb.from('goals').insert(row);
      if (res.error) { $('g-err').textContent = res.error.message; return; }
      closeSheet(); refresh();
    };
    if (goal) $('g-del').onclick = async () => {
      await sb.from('goals').update({ is_active:false }).eq('id', goal.id);
      closeSheet(); refresh();
    };
    if (!goal) setTimeout(() => $('g-name').focus(), 80);
  });
}

$('addItem').onclick = () => itemSheet(null);
$('addTx').onclick   = () => txSheet(null);
$('addGoal').onclick = () => goalSheet(null);
document.addEventListener('click', e => {
  const c = e.target.closest('[data-contrib]');
  if (c) return itemSheet(null, c.dataset.contrib);
  const s = e.target.closest('[data-spend]');
  if (s) return txSheet(null, s.dataset.spend);
  const g = e.target.closest('[data-goal]');
  if (g) return goalSheet(state.goals.find(x => x.id === g.dataset.goal));
  const i = e.target.closest('[data-item]');
  if (i) return itemSheet(state.items.find(x => x.id === i.dataset.item));
  const t = e.target.closest('[data-tx]');
  if (t) return txSheet(state.tx.find(x => x.id === t.dataset.tx));
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(function(){}));
}
</script>
